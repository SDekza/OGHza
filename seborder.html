<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Referrer Policy to ensure external images (Shopee/Alibaba CDN) display smoothly without 403 blocks -->
    <meta name="referrer" content="no-referrer">
    <title>SEB - แอปสั่งงานพนักงาน (Senior Friendly Edition)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel JS -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDK (v10 COMPAT) for Firebase Firestore integration -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Google Fonts & Custom CSS -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Anuphan', sans-serif;
        }

        /* Prevent page-level gesture zoom */
        html, body {
            touch-action: pan-x pan-y;
            background-color: #f1f5f9;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .saas-card {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            box-shadow: 0 4px 15px -2px rgba(15, 23, 42, 0.08);
        }

        @keyframes pop-in {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop-in 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Lightbox Image Pinch Zoom Utility */
        .zoomable-container {
            touch-action: none;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, memo } = React;

        // Firebase Config matched with sebo.html (stock-spare-c9692)
        const firebaseConfig = {
            apiKey: "AIzaSyCLKMgC5Y_zg97VaWjPVFXpXhp2zon7TP0",
            authDomain: "stock-spare-c9692.firebaseapp.com",
            projectId: "stock-spare-c9692",
            storageBucket: "stock-spare-c9692.firebasestorage.app",
            messagingSenderId: "376839440950",
            appId: "1:376839440950:web:d6d0c583e4eabf107e2697",
            measurementId: "G-0T0KQ5NGEV"
        };

        let db = null;
        try {
            if (window.firebase && !firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            if (window.firebase) {
                db = firebase.firestore();
                firebase.auth().signInAnonymously().catch(() => {});
            }
        } catch (e) {
            console.warn("Firebase initialization warning:", e);
        }

        // Categories list
        const CATEGORIES_LIST = [
            "สร้อย", "สร้อย(หมุน)", "กำไล", "กำไล(หมุน)", "สายรัดเข็มขัด",
            "จี้", "สายคล้องรองเท้า", "สายคล้องโทรศัพท์", "ที่คั่นหนังสือ", "แหวน", "พวงกุญแจ", "แหวนรองเท้า", "งานทั่วไป"
        ];

        const Icon = memo(({ name, size = 20, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    ref.current.appendChild(i);
                    window.lucide.createIcons({
                        root: ref.current,
                        nameAttr: 'data-lucide',
                        attrs: { width: size, height: size, class: `w-full h-full ${className}` }
                    });
                }
            }, [name, size, className]);
            return <span ref={ref} className="inline-flex items-center justify-center shrink-0" style={{ width: size, height: size }} />;
        });

        const LightboxModal = ({ src, onClose }) => {
            const [scale, setScale] = useState(1);
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const touchStartRef = useRef({ distance: 0, x: 0, y: 0 });

            const handleTouchStart = (e) => {
                if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    touchStartRef.current.distance = dist;
                } else if (e.touches.length === 1) {
                    touchStartRef.current.x = e.touches[0].clientX - position.x;
                    touchStartRef.current.y = e.touches[0].clientY - position.y;
                }
            };

            const handleTouchMove = (e) => {
                if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    if (touchStartRef.current.distance > 0) {
                        const factor = dist / touchStartRef.current.distance;
                        setScale(prevScale => Math.min(Math.max(1, prevScale * factor), 4));
                    }
                    touchStartRef.current.distance = dist;
                } else if (e.touches.length === 1 && scale > 1) {
                    setPosition({
                        x: e.touches[0].clientX - touchStartRef.current.x,
                        y: e.touches[0].clientY - touchStartRef.current.y
                    });
                }
            };

            const resetZoom = () => {
                setScale(1);
                setPosition({ x: 0, y: 0 });
            };

            return (
                <div 
                    className="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md flex flex-col items-center justify-between p-4 animate-pop select-none overflow-hidden"
                    onClick={onClose}
                >
                    <div className="w-full flex items-center justify-between z-10 pt-2 px-2">
                        <span className="text-white text-xs font-bold bg-white/20 backdrop-blur px-3 py-1.5 rounded-full">
                            💡 ถ่างนิ้วเพื่อซูมดูรูปภาพ
                        </span>
                        <div className="flex items-center gap-2">
                            {scale > 1 && (
                                <button 
                                    onClick={(e) => { e.stopPropagation(); resetZoom(); }} 
                                    className="bg-white/20 text-white p-2.5 rounded-full hover:bg-white/30 text-xs font-bold"
                                >
                                    รีเซ็ต
                                </button>
                            )}
                            <button 
                                onClick={onClose}
                                className="bg-slate-800 text-white p-3 rounded-full hover:bg-slate-700 transition-colors shadow-lg"
                            >
                                <Icon name="x" size={24} />
                            </button>
                        </div>
                    </div>

                    <div 
                        className="zoomable-container flex-1"
                        onClick={e => e.stopPropagation()}
                        onTouchStart={handleTouchStart}
                        onTouchMove={handleTouchMove}
                    >
                        <img 
                            src={src} 
                            loading="lazy"
                            referrerPolicy="no-referrer" 
                            style={{ 
                                transform: `translate(${position.x}px, ${position.y}px) scale(${scale})`,
                                transition: scale === 1 ? 'transform 0.2s ease-out' : 'none'
                            }}
                            className="max-w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl pointer-events-auto" 
                        />
                    </div>
                </div>
            );
        };

        const App = () => {
            // User Session State (Linked with login.html)
            const [currentUser] = useState(() => 
                localStorage.getItem('seb_current_user') || localStorage.getItem('seb_user') || 'Admin'
            );
            const [currentUserRank] = useState(() => 
                localStorage.getItem('seb_current_rank') || 'Admin'
            );
            const [dbConnected, setDbConnected] = useState(false);

            // Master Catalog State - SHARED WITH sebo.html via 'sebo_products'
            const [catalog, setCatalog] = useState([]);

            // App Task Queue State - SEPARATE COLLECTION 'seb_tasks'
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('seb_app_tasks');
                return saved ? JSON.parse(saved) : [];
            });

            // Mobile FAB Floating Menu Toggle State
            const [showFabMenu, setShowFabMenu] = useState(false);

            // 1. Listen to Real-time Master Catalog (`sebo_products` - SHARED)
            useEffect(() => {
                if (!db) return;

                const unsubProducts = db.collection("sebo_products").onSnapshot(
                    (snapshot) => {
                        const cloudProds = [];
                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            cloudProds.push({
                                id: doc.id,
                                name: data.name || '',
                                category: data.category || 'สร้อย',
                                imgUrl: data.imgUrl || data.imageUrl || ''
                            });
                        });
                        cloudProds.sort((a, b) => a.name.localeCompare(b.name, 'th'));
                        setCatalog(cloudProds);
                        setDbConnected(true);
                    },
                    (err) => {
                        console.warn("Firestore catalog sync warning:", err);
                        setDbConnected(false);
                    }
                );

                return () => unsubProducts();
            }, []);

            // 2. Listen to Real-time App Tasks (`seb_tasks` - SEPARATE APP QUEUE)
            useEffect(() => {
                if (!db) return;

                const unsubTasks = db.collection("seb_tasks").onSnapshot(
                    (snapshot) => {
                        const cloudTasks = [];
                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            cloudTasks.push({
                                id: doc.id,
                                ...data,
                                productName: data.productName || '',
                                quantity: data.quantity || 1,
                                deliveredQty: data.deliveredQty || 0,
                                deliveryBatches: data.deliveryBatches || [],
                                timestampMs: data.timestampMs || Date.now()
                            });
                        });
                        cloudTasks.sort((a, b) => (b.timestampMs || 0) - (a.timestampMs || 0));
                        setTasks(cloudTasks);
                        setDbConnected(true);
                    },
                    (err) => {
                        console.warn("Firestore tasks sync warning:", err);
                        setDbConnected(false);
                    }
                );

                return () => unsubTasks();
            }, []);

            // Fast Lookup Map for Matching Product Names to Images in Master Catalog
            const catalogImageMap = useMemo(() => {
                const map = {};
                catalog.forEach(item => {
                    if (item.name) {
                        const key = item.name.trim().toLowerCase();
                        map[key] = item.imgUrl || item.imageUrl || '';
                    }
                });
                return map;
            }, [catalog]);

            // Helper function to resolve product image dynamically by matching productName
            const getProductImage = (productName, fallbackUrl = '') => {
                if (!productName) return fallbackUrl;
                const key = productName.trim().toLowerCase();
                const matchedUrl = catalogImageMap[key];
                return (matchedUrl !== undefined && matchedUrl !== '') ? matchedUrl : fallbackUrl;
            };

            const [activeTab, setActiveTab] = useState('orders'); // orders | create | products
            const [taskStatusFilter, setTaskStatusFilter] = useState('pending'); // pending | doing | done
            const [quickTagFilter, setQuickTagFilter] = useState('all'); // all | urgent | stock
            const [sortOrder, setSortOrder] = useState('dueDate'); // dueDate | createdAsc | createdDesc
            const [viewMode, setViewMode] = useState('card'); // card | compact
            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('all');

            // Product Catalog Search & Pagination State (Tab 3)
            const [productSearch, setProductSearch] = useState('');
            const [productPage, setProductPage] = useState(1);
            const [expandedProduct, setExpandedProduct] = useState(null);

            // Action Confirmation Modal State
            const [actionModal, setActionModal] = useState(null);

            // Partial / Batch Delivery Modal State (ส่งงานบางส่วน)
            const [partialDeliveryModal, setPartialDeliveryModal] = useState(null); 

            // Delete Task Modal State
            const [taskToDelete, setTaskToDelete] = useState(null);

            // Delete All Tasks Modal State
            const [showDeleteAllModal, setShowDeleteAllModal] = useState(false);
            const [isDeletingAll, setIsDeletingAll] = useState(false);

            // CSV Import & Export State
            const [showImportModal, setShowImportModal] = useState(false);
            const [importFileTasks, setImportFileTasks] = useState([]);
            const [isImporting, setIsImporting] = useState(false);
            const fileInputRef = useRef(null);

            // Form State for Creating Orders
            const [form, setForm] = useState({
                type: 'สร้อย',
                productName: '',
                quantity: 1,
                memo: '',
                dueDate: '',
                isUrgent: false,
                isStock: false
            });

            // Autocomplete Suggestion State
            const [showSuggestions, setShowSuggestions] = useState(false);
            const searchBoxRef = useRef(null);

            // Preview Lightbox State
            const [previewImg, setPreviewImg] = useState(null);

            // UI Toast
            const [toast, setToast] = useState(null);
            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2500);
            };

            // Close suggestion box on outside click
            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (searchBoxRef.current && !searchBoxRef.current.contains(e.target)) {
                        setShowSuggestions(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            // Save Tasks to LocalStorage
            useEffect(() => {
                localStorage.setItem('seb_app_tasks', JSON.stringify(tasks));
            }, [tasks]);

            // Reset pagination when searching in product catalog
            useEffect(() => {
                setProductPage(1);
            }, [productSearch]);

            // Check Privilege / Ownership for Task Management
            const isAdminOrDev = currentUserRank === 'Admin' || currentUserRank === 'Dev';

            const canManageTask = (task) => {
                if (!task) return false;
                if (isAdminOrDev) return true;
                const user = String(currentUser || '').trim().toLowerCase();
                const assigned = String(task.assignedBy || task.user || '').trim().toLowerCase();
                const doing = String(task.doingBy || '').trim().toLowerCase();
                const done = String(task.doneBy || '').trim().toLowerCase();
                return user && (user === assigned || user === doing || user === done || !task.doingBy);
            };

            const handleConsolidatePendingTasks = async () => {
                const pendingList = tasks.filter(t => t.status === 'pending');
                if (pendingList.length <= 1) {
                    showToast('ℹ️ ไม่พบรายการคิวงานซ้ำซ้อนในค้างทำ');
                    return;
                }

                // Group pending tasks by matching key fields
                const groups = {};
                pendingList.forEach(t => {
                    const key = [
                        (t.productName || '').trim().toLowerCase(),
                        (t.type || ''),
                        (t.memo || '').trim(),
                        (t.dueDate || ''),
                        !!t.isUrgent,
                        !!t.isStock
                    ].join('||');

                    if (!groups[key]) groups[key] = [];
                    groups[key].push(t);
                });

                let mergedCount = 0;

                if (db) {
                    const batch = db.batch();
                    let hasChanges = false;

                    Object.values(groups).forEach(group => {
                        if (group.length > 1) {
                            const primaryTask = group[0];
                            const totalQty = group.reduce((sum, item) => sum + (parseInt(item.quantity) || 1), 0);
                            
                            batch.update(db.collection("seb_tasks").doc(primaryTask.id), { quantity: totalQty });
                            
                            for (let i = 1; i < group.length; i++) {
                                batch.delete(db.collection("seb_tasks").doc(group[i].id));
                            }
                            hasChanges = true;
                            mergedCount += (group.length - 1);
                        }
                    });

                    if (hasChanges) {
                        try {
                            await batch.commit();
                            showToast(`⚡ รวมคิวงานซ้ำกลับเป็นใบเดียวเรียบร้อยแล้ว (${mergedCount} รายการ)`);
                        } catch (err) {
                            console.error("Batch consolidate error:", err);
                            showToast('❌ ไม่สามารถรวมการ์ดงานซ้ำได้');
                        }
                    } else {
                        showToast('ℹ️ ไม่พบรายการงานซ้ำกันในคิวค้างทำ');
                    }
                } else {
                    let newTasks = [...tasks];
                    Object.values(groups).forEach(group => {
                        if (group.length > 1) {
                            const primaryTask = group[0];
                            const totalQty = group.reduce((sum, item) => sum + (parseInt(item.quantity) || 1), 0);
                            const deleteIds = new Set(group.slice(1).map(g => g.id));

                            newTasks = newTasks.filter(t => !deleteIds.has(t.id)).map(t => t.id === primaryTask.id ? { ...t, quantity: totalQty } : t);
                            mergedCount += (group.length - 1);
                        }
                    });
                    setTasks(newTasks);
                    if (mergedCount > 0) {
                        showToast(`⚡ รวมคิวงานซ้ำกลับเป็นใบเดียวเรียบร้อยแล้ว (${mergedCount} รายการ)`);
                    } else {
                        showToast('ℹ️ ไม่พบรายการงานซ้ำกันในคิวค้างทำ');
                    }
                }
            };

            const handleAddTask = async (e) => {
                e.preventDefault();
                if (!form.productName.trim()) {
                    showToast('⚠️ กรุณาระบุชื่อสินค้าหรือรายละเอียดงาน');
                    return;
                }

                // Check if a pending task with exact same specs exists, auto-merge if so
                const existingPending = tasks.find(t => 
                    t.status === 'pending' &&
                    (t.productName || '').trim().toLowerCase() === form.productName.trim().toLowerCase() &&
                    (t.type || '') === form.type &&
                    (t.memo || '').trim() === (form.memo || '').trim() &&
                    (t.dueDate || '') === (form.dueDate || '') &&
                    !!t.isUrgent === !!form.isUrgent &&
                    !!t.isStock === !!form.isStock
                );

                const addQty = parseInt(form.quantity) || 1;

                if (existingPending) {
                    const newQty = (existingPending.quantity || 0) + addQty;
                    if (db) {
                        try {
                            await db.collection("seb_tasks").doc(existingPending.id).update({ quantity: newQty });
                        } catch (err) {
                            console.error("Firestore merge add error:", err);
                            setTasks(prev => prev.map(t => t.id === existingPending.id ? { ...t, quantity: newQty } : t));
                        }
                    } else {
                        setTasks(prev => prev.map(t => t.id === existingPending.id ? { ...t, quantity: newQty } : t));
                    }
                    showToast(`พวกรวมสั่งเพิ่ม ${addQty} ชิ้น เข้ากับการ์ดค้างทำเดิมแล้ว (รวมเป็น ${newQty} ชิ้น)`);
                } else {
                    const taskId = 'TASK-' + Date.now();
                    const newTask = {
                        id: taskId,
                        timestamp: new Date().toLocaleString('th-TH'),
                        timestampMs: Date.now(),
                        type: form.type,
                        productName: form.productName.trim(),
                        quantity: addQty,
                        deliveredQty: 0,
                        deliveryBatches: [],
                        memo: form.memo,
                        dueDate: form.dueDate || '',
                        isUrgent: form.isUrgent,
                        isStock: form.isStock,
                        status: 'pending',
                        assignedBy: currentUser,
                        user: currentUser,
                        doingBy: '',
                        doneBy: '',
                        doneTimestamp: ''
                    };

                    if (db) {
                        try {
                            await db.collection("seb_tasks").doc(taskId).set(newTask);
                        } catch (err) {
                            console.error("Firestore add error:", err);
                            setTasks(prev => [newTask, ...prev]);
                        }
                    } else {
                        setTasks(prev => [newTask, ...prev]);
                    }
                    showToast(`ส่งงาน "${newTask.productName}" เรียบร้อยแล้ว`);
                }

                // Reset Form
                setForm({
                    type: 'สร้อย',
                    productName: '',
                    quantity: 1,
                    memo: '',
                    dueDate: '',
                    isUrgent: false,
                    isStock: false
                });
                setActiveTab('orders');
                setTaskStatusFilter('pending');
            };

            const openPartialDeliveryModal = (task) => {
                if (!canManageTask(task)) {
                    showToast('⚠️ คุณไม่มีสิทธิ์จัดการรายการนี้');
                    return;
                }
                const delivered = task.deliveredQty || 0;
                const total = task.quantity || 1;
                const remaining = Math.max(1, total - delivered);

                setPartialDeliveryModal({
                    task,
                    inputQty: remaining,
                    memo: ''
                });
            };

            const executePartialDelivery = async (shouldSplit = false) => {
                if (!partialDeliveryModal) return;
                const { task, inputQty, memo } = partialDeliveryModal;
                const addQty = parseInt(inputQty) || 0;

                if (addQty <= 0) {
                    showToast('⚠️ กรุณาระบุจำนวนชิ้นอย่างน้อย 1 ชิ้น');
                    return;
                }

                const currentDelivered = task.deliveredQty || 0;
                const totalQty = task.quantity || 1;
                const newDelivered = currentDelivered + addQty;
                const remainingQtyAfterAdd = totalQty - newDelivered;
                const isCompleted = newDelivered >= totalQty;

                const nowStr = new Date().toLocaleString('th-TH');
                const batchRecord = {
                    id: 'BATCH-' + Date.now(),
                    qty: addQty,
                    deliveredBy: currentUser,
                    timestamp: nowStr,
                    memo: memo.trim()
                };

                const updatedBatches = [...(task.deliveryBatches || []), batchRecord];

                // SPLIT TASK Logic
                if (shouldSplit && !isCompleted && remainingQtyAfterAdd > 0) {
                    const completedTaskId = task.id;

                    const completedTaskUpdates = {
                        quantity: newDelivered,
                        deliveredQty: newDelivered,
                        deliveryBatches: updatedBatches,
                        status: 'done',
                        doingBy: task.doingBy || currentUser,
                        doneBy: currentUser,
                        doneTimestamp: nowStr
                    };

                    const matchPending = tasks.find(t => 
                        t.id !== completedTaskId &&
                        t.status === 'pending' &&
                        (t.productName || '').trim().toLowerCase() === (task.productName || '').trim().toLowerCase() &&
                        (t.type || '') === (task.type || '') &&
                        (t.memo || '').trim() === (task.memo || '').trim() &&
                        (t.dueDate || '') === (task.dueDate || '') &&
                        !!t.isUrgent === !!task.isUrgent &&
                        !!t.isStock === !!task.isStock
                    );

                    if (matchPending) {
                        const newPendingTotal = (matchPending.quantity || 0) + remainingQtyAfterAdd;
                        if (db) {
                            try {
                                const batch = db.batch();
                                batch.update(db.collection("seb_tasks").doc(completedTaskId), completedTaskUpdates);
                                batch.update(db.collection("seb_tasks").doc(matchPending.id), { quantity: newPendingTotal });
                                await batch.commit();
                            } catch (err) {
                                console.error("Firestore split & merge error:", err);
                                setTasks(prev => prev.map(t => {
                                    if (t.id === completedTaskId) return { ...t, ...completedTaskUpdates };
                                    if (t.id === matchPending.id) return { ...t, quantity: newPendingTotal };
                                    return t;
                                }));
                            }
                        } else {
                            setTasks(prev => prev.map(t => {

                            setActionModal(null);
                            showToast(`✂️ แยกงาน ${delivered} ชิ้นไป "เสร็จแล้ว" และคืนคิว ${remaining} ชิ้นไป "ค้างทำ" เรียบร้อยค่ะ`);

                    doneBy: '',

                if (nextStatus === 'pending') showToast('↩️ คืนรายการเข้าคิวงาน "ค้างทำ" เรียบร้อยค่ะ');

            const confirmDeleteTask = async () => {

            const handleExportCSV = (exportAll = true) => {
                const targetTasks = exportAll ? tasks : filteredTasks;
                if (targetTasks.length === 0) {
                    showToast('⚠️ ไม่มีรายการคิวงานสำหรับส่งออก');
                    return;
                }

                const headers = [
                    "รหัสงาน", "วันเวลาสั่ง", "วันที่ต้องการใช้", "ประเภท", "ชื่อสินค้า", "จำนวนทั้งหมด",
                    "ส่งมอบแล้ว", "คงเหลือ", "หมายเหตุ", "งานด่วน", "เติมสต๊อก", "สถานะ", "ผู้สั่งงาน",
                    "ผู้รับงาน", "ผู้ทำเสร็จ", "วันเวลาเสร็จ"
                ];

                const escapeCSV = (val) => {
                    if (val === null || val === undefined) return '""';
                    return `"${String(val).replace(/"/g, '""')}"`;
                };

                const rows = targetTasks.map(t => {
                    const statusLabel = t.status === 'done' ? 'เสร็จเรียบร้อย' : (t.status === 'doing' ? 'กำลังทำอยู่' : 'ค้างทำ');
                    const totalQty = t.quantity || 1;
                    const deliveredQty = t.deliveredQty || (t.status === 'done' ? totalQty : 0);
                    const remainingQty = Math.max(0, totalQty - deliveredQty);

                    return [
                        t.id || '',
                        t.timestamp || '',
                        t.dueDate || '',
                        t.type || 'สร้อย',
                        t.productName || '',
                        totalQty,
                        deliveredQty,
                        remainingQty,
                        t.memo || '',
                        t.isUrgent ? 'ด่วน' : 'ปกติ',
                        t.isStock ? 'สต๊อก' : 'ทั่วไป',
                        statusLabel,
                        t.assignedBy || t.user || '',
                        t.doingBy || '',
                        t.doneBy || '',
                        t.doneTimestamp || ''
                    ].map(escapeCSV).join(',');
                });

                const csvContent = "\uFEFF" + [headers.map(escapeCSV).join(','), ...rows].join("\r\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                const dateStr = new Date().toISOString().split('T')[0];
                link.setAttribute('download', `SEB_Order_Tasks_${dateStr}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                showToast(`ส่งออกข้อมูล ${targetTasks.length} รายการเป็นไฟล์ Excel CSV เรียบร้อยแล้ว`);
            };

            const parseCSVText = (text) => {
                const lines = [];
                let curLine = [];
                let curVal = '';
                let inQuotes = false;

                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const nextChar = text[i + 1];

                    if (char === '"' && inQuotes && nextChar === '"') {
                        curVal += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        curLine.push(curVal.trim());
                        curVal = '';
                    } else if ((char === '\r' || char === '\n') && !inQuotes) {
                        if (char === '\r' && nextChar === '\n') i++;
                        curLine.push(curVal.trim());
                        if (curLine.some(cell => cell.length > 0)) lines.push(curLine);
                        curLine = [];
                        curVal = '';
                    } else {
                        curVal += char;
                    }
                }
                if (curVal || curLine.length > 0) {
                    curLine.push(curVal.trim());
                    if (curLine.some(cell => cell.length > 0)) lines.push(curLine);
                }
                return lines;
            };

                            const deliveredQty = parseInt(row[6]) || 0;
                            const memo = row[8] || '';
                            const isUrgent = (row[9] === 'ด่วน' || row[9] === 'true' || row[9] === 'TRUE');
                            const isStock = (row[10] === 'สต๊อก' || row[10] === 'true' || row[10] === 'TRUE');
                            
                            let status = 'pending';
                            if (row[11] && (row[11].includes('ทำอยู่') || row[11] === 'doing')) status = 'doing';
                            if (row[11] && (row[11].includes('เสร็จ') || row[11] === 'done')) status = 'done';

                            const assignedBy = row[12] || currentUser;

                            const doneBy = row[14] || '';
                            const doneTimestamp = row[15] || '';

                                productName,
                                quantity,
                                deliveredQty,

                                isUrgent,
                                isStock,
                                status,
                                assignedBy,
                                user: assignedBy,
                                doingBy,
                                doneBy,
                                doneTimestamp
                            };

                        if (importedItems.length === 0) {

                            return;

                        setImportFileTasks(importedItems);
                        setShowImportModal(true);
                    } catch (err) {
                        console.error("CSV import error:", err);
                        showToast('❌ รูปแบบไฟล์ CSV ไม่ถูกต้อง');
                    }

                reader.readAsText(file, 'UTF-8');
                e.target.value = '';

            const confirmImport = async () => {

            const filteredSuggestions = useMemo(() => {
                if (!form.productName.trim()) return catalog;

            const pendingStockCount = useMemo(() => pendingTasksAll.filter(t => t.isStock).length, [pendingTasksAll]);

            const filteredTasks = useMemo(() => {
                const list = tasks.filter(t => {
                    const matchStatus = t.status === taskStatusFilter;
                    const matchSearch = t.productName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                        (t.memo && t.memo.toLowerCase().includes(searchTerm.toLowerCase()));
                    const matchCat = categoryFilter === 'all' || t.type === categoryFilter;
                    
                    let matchTag = true;
                    if (taskStatusFilter === 'pending') {

                    } else if (sortOrder === 'createdDesc') {

                    return 0;
                });

                                                                        <button
                                                                            onClick={() => promptStatusChange(task, 'pending')}
                                                                            className="px-4 h-12 bg-amber-100 hover:bg-amber-200 text-amber-900 border-2 border-amber-300 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all shadow-sm"
                                                                            title="ย้อนกลับไปค้างทำ"
                                                                        >
                                                                            <Icon name="rotate-ccw" size={16} />
                                                                            <span>คืนคิวงาน</span>
                                                                        </button>
                                                                    )}
                                                                </>
                                                            )}

                                                            {task.status === 'done' && (
                                                                <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
                                                                    <span className="text-xs sm:text-sm text-emerald-800 font-bold bg-emerald-50 px-3 py-2 rounded-xl border border-emerald-200 text-center">
                                                                        ✓ เสร็จสิ้นโดย: {task.doneBy || 'พนักงาน'} {task.doneTimestamp ? `(${task.doneTimestamp})` : ''}
                                                                    </span>

                                                                    {isUserAllowed && (
                                                                        <button
                                                                            onClick={() => promptStatusChange(task, 'doing')}
                                                                            className="px-3.5 h-10 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 border-2 border-indigo-300 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition-all shrink-0"
                                                                            title="ดึงงานกลับมาแก้ไขในกำลังทำ"
                                                                        >
                                                                            <Icon name="rotate-ccw" size={16} />
                                                                            <span>ย้อนกลับไปกำลังทำ</span>
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'create' && (
                            <div className="saas-card p-5 sm:p-6 rounded-2xl bg-white space-y-5 animate-pop border-2 border-slate-300">
                                <h2 className="text-base sm:text-lg font-bold text-slate-900 border-b pb-3 flex items-center gap-2">
                                    <Icon name="plus-circle" className="text-indigo-600" size={24} />
                                    <span>สร้างฟอร์มสั่งงานพนักงานใหม่</span>
                                </h2>

                                <form onSubmit={handleAddTask} className="space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        {/* Category Select */}
                                        <div className="space-y-1">
                                            <label className="text-xs font-bold text-slate-700">ประเภทงาน/สินค้า</label>
                                            <select 
                                                value={form.type}
                                                onChange={(e) => setForm({...form, type: e.target.value})}
                                                className="w-full h-12 bg-slate-50 border-2 border-slate-300 rounded-xl px-3 text-sm font-bold outline-none focus:border-indigo-500"
                                            >
                                                {CATEGORIES_LIST.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                            </select>
                                        </div>

                                        {/* Quantity */}
                                        <div className="space-y-1">
                                            <label className="text-xs font-bold text-slate-700">จำนวนที่ต้องผลิต (ชิ้น)</label>
                                            <input 
                                                type="number"
                                                min="1"
                                                value={form.quantity}
                                                onChange={(e) => setForm({...form, quantity: e.target.value})}
                                                className="w-full h-12 bg-slate-50 border-2 border-slate-300 rounded-xl px-3 text-sm font-extrabold text-indigo-700 outline-none focus:border-indigo-500"
                                                required
                                            />
                                        </div>

                                        {/* Due Date Input */}
                                        <div className="space-y-1">
                                            <label className="text-xs font-bold text-amber-900 flex items-center gap-1">
                                                <span>📅 วันที่ต้องการใช้สินค้า</span>
                                                <span className="text-[10px] text-amber-700 font-semibold">(ระบุเพื่อจัดคิว)</span>
                                            </label>
                                            <input 
                                                type="date"
                                                value={form.dueDate}
                                                onChange={(e) => setForm({...form, dueDate: e.target.value})}
                                                className="w-full h-12 bg-amber-50/60 border-2 border-amber-300 rounded-xl px-3 text-xs sm:text-sm font-extrabold text-amber-950 outline-none focus:border-amber-500"
                                            />
                                        </div>
                                    </div>

                                    {/* Product Name with Autocomplete */}
                                    <div className="space-y-1 relative" ref={searchBoxRef}>
                                        <label className="text-xs font-bold text-slate-700 flex items-center justify-between">
                                            <span>ชื่อสินค้า / รายละเอียดงาน</span>
                                            <span className="text-xs text-indigo-600 font-bold">💡 พิมพ์ชื่อเพื่อจับคู่รูปภาพคลังอัตโนมัติ</span>
                                        </label>
                                        
                                        <div className="relative">
                                            <input 
                                                type="text"
                                                placeholder="พิมพ์ชื่อสินค้า เช่น บานเย็น|ขาว, ดาวแดง..."
                                                value={form.productName}
                                                onChange={(e) => {
                                                    setForm({...form, productName: e.target.value});
                                                    setShowSuggestions(true);
                                                }}
                                                onFocus={() => setShowSuggestions(true)}
                                                className="w-full h-12 bg-slate-50 border-2 border-slate-300 rounded-xl px-3 pr-10 text-sm font-bold outline-none focus:border-indigo-500"
                                                required
                                            />
                                            {form.productName && (
                                                <button 
                                                    type="button" 
                                                    onClick={() => setForm({...form, productName: ''})}
                                                    className="absolute right-3 top-3 text-slate-400 hover:text-slate-600"
                                                >
                                                    <Icon name="x-circle" size={20} />
                                                </button>
                                            )}
                                        </div>

                                        {/* Suggestions Dropdown */}
                                        {showSuggestions && filteredSuggestions.length > 0 && (
                                            <div className="absolute z-50 left-0 right-0 top-[100%] mt-1 bg-white border-2 border-slate-300 rounded-2xl shadow-2xl overflow-hidden max-h-60 overflow-y-auto saas-card">
                                                <div className="p-2 text-xs font-bold text-slate-500 border-b border-slate-200 bg-slate-100 flex items-center justify-between">
                                                    <span>คลังรูปสินค้าหลัก Firebase ({filteredSuggestions.length})</span>
                                                </div>
                                                {filteredSuggestions.map((item, idx) => (
                                                    <div 
                                                        key={item.id || idx}
                                                        onClick={() => {
                                                            setForm({
                                                                ...form, 
                                                                productName: item.name, 
                                                                type: item.category || form.type
                                                            });
                                                            setShowSuggestions(false);
                                                        }}
                                                        className="p-3 hover:bg-indigo-50 cursor-pointer flex items-center gap-3 border-b border-slate-100 last:border-0 transition-colors"
                                                    >
                                                        <div className="w-12 h-12 rounded-xl bg-slate-100 border border-slate-300 shrink-0 overflow-hidden flex items-center justify-center">
                                                            {item.imgUrl ? (
                                                                <img 
                                                                    src={item.imgUrl} 
                                                                    loading="lazy"
                                                                    referrerPolicy="no-referrer" 
                                                                    className="w-full h-full object-cover" 
                                                                />
                                                            ) : (
                                                                <Icon name="package" size={20} className="text-slate-400" />
                                                            )}
                                                        </div>

                                                        <div className="flex-1 min-w-0 text-left">
                                                            <div className="flex items-center justify-between">
                                                                <span className="text-sm font-bold text-slate-900 truncate">{item.name}</span>
                                                                <span className="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600 shrink-0">
                                                                    {item.category || 'สร้อย'}
                                                                </span>
                                                            </div>
                                                            <p className="text-xs text-indigo-600 font-semibold truncate">แตะเพื่อเลือกสินค้านี้ลงฟอร์ม</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* Dynamic Matched Image Preview Box */}
                                    {getProductImage(form.productName) ? (
                                        <div className="bg-indigo-50 p-3 rounded-2xl border-2 border-indigo-200 flex items-center gap-4 animate-pop">
                                            <div className="w-16 h-16 rounded-xl bg-white border border-slate-300 overflow-hidden shrink-0">
                                                <img 
                                                    src={getProductImage(form.productName)} 
                                                    loading="lazy"
                                                    referrerPolicy="no-referrer" 
                                                    className="w-full h-full object-cover" 
                                                />
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <span className="text-xs font-extrabold text-indigo-700 bg-indigo-100 px-2.5 py-0.5 rounded-lg">
                                                    ✓ แมตช์รูปภาพตรงกับคลังสินค้าอัตโนมัติ
                                                </span>
                                                <p className="text-sm font-extrabold text-slate-900 truncate mt-1">{form.productName}</p>
                                            </div>
                                        </div>
                                    ) : form.productName.trim() ? (
                                        <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center gap-3">
                                            <Icon name="info" size={20} className="text-slate-400 shrink-0" />
                                            <p className="text-xs text-slate-500 font-medium">ไม่พบรูปภาพตรงตามชื่อนี้ในคลังหลัก (สามารถสั่งผลิตเป็นงานกำหนดเองได้)</p>
                                        </div>
                                    ) : null}

                                    {/* Memo */}
                                    <div className="space-y-1">
                                        <label className="text-xs font-bold text-slate-700">หมายเหตุเฉพาะ (ความยาว, ลายพิเศษ)</label>
                                        <textarea 
                                            rows="2"
                                            placeholder="ระบุขนาดความยาว, ลายลูกปัด, ข้อความพิเศษ..."
                                            value={form.memo}
                                            onChange={(e) => setForm({...form, memo: e.target.value})}
                                            className="w-full p-3 bg-slate-50 border-2 border-slate-300 rounded-xl text-xs sm:text-sm font-bold outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    {/* Options Toggles */}
                                    <div className="grid grid-cols-2 gap-3">
                                        <button 
                                            type="button"
                                            onClick={() => setForm({...form, isUrgent: !form.isUrgent})}
                                            className={`h-12 rounded-xl text-xs sm:text-sm font-extrabold border-2 transition-all ${
                                                form.isUrgent 
                                                    ? 'bg-red-600 text-white border-red-700 shadow-md' 
                                                    : 'bg-slate-100 text-slate-500 border-slate-300'
                                            }`}
                                        >
                                            🔥 งานเร่งด่วนพิเศษ
                                        </button>

                                        <button 
                                            type="button"
                                            onClick={() => setForm({...form, isStock: !form.isStock})}
                                            className={`h-12 rounded-xl text-xs sm:text-sm font-extrabold border-2 transition-all ${
                                                form.isStock 
                                                    ? 'bg-indigo-600 text-white border-indigo-700 shadow-md' 
                                                    : 'bg-slate-100 text-slate-500 border-slate-300'
                                            }`}
                                        >
                                            📦 ผลิตเพื่อเติมสต๊อก
                                        </button>
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full h-14 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-sm font-extrabold tracking-wider uppercase transition-all shadow-lg active:scale-98 border-b-4 border-indigo-900"
                                    >
                                        ยืนยันส่งงานเข้าคิวพนักงาน
                                    </button>
                                </form>
                            </div>
                        )}

                        {activeTab === 'products' && (
                            <div className="space-y-4 animate-pop">
                                {/* Search Box */}
                                <div className="saas-card p-5 rounded-2xl bg-white border-2 border-slate-300 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <h2 className="text-base font-bold text-slate-900">คลังรูปสินค้าหลัก (Shared with sebo.html)</h2>
                                            <p className="text-xs text-slate-500 font-semibold">ดึงข้อมูลรูปภาพจาก Firebase Collection sebo_products แบบ Real-time</p>
                                        </div>
                                        <span className="text-xs font-extrabold text-indigo-800 bg-indigo-100 px-3 py-1 rounded-xl shrink-0">
                                            รวม {filteredCatalog.length} รายการ
                                        </span>
                                    </div>

                                    {/* Clean Search Bar */}
                                    <div className="relative flex items-center">
                                        <div className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none w-5 h-5 flex items-center justify-center">
                                            <Icon name="search" size={18} />
                                        </div>
                                        <input 
                                            type="text" 
                                            placeholder="ค้นหารูปสินค้า เช่น บานเย็น, ดาว..."
                                            value={productSearch}
                                            onChange={(e) => setProductSearch(e.target.value)}
                                            className="w-full pl-10 pr-4 h-12 bg-slate-50 border-2 border-slate-300 rounded-xl text-xs sm:text-sm font-bold outline-none focus:border-indigo-500 transition-colors"
                                        />
                                    </div>
                                </div>

                                {/* Products List with Accordion Logs Dropdown */}
                                <div className="space-y-3">
                                    {paginatedCatalog.length === 0 ? (
                                        <div className="text-center py-12 saas-card rounded-2xl bg-white border-2 border-dashed border-slate-300 p-6">
                                            <Icon name="search-x" size={48} className="text-slate-300 mx-auto mb-2" />
                                            <p className="text-sm font-bold text-slate-500">ไม่พบรายการสินค้าตรงตามคำค้นหา</p>
                                        </div>
                                    ) : (
                                        paginatedCatalog.map((p, index) => {
                                            const productLogs = tasks.filter(t => t.productName === p.name);
                                            const isExpanded = expandedProduct === p.name;

                                            return (
                                                <div 
                                                    key={p.id || index} 
                                                    className="saas-card p-3.5 rounded-2xl bg-white border-2 border-slate-300 transition-all hover:border-indigo-400"
                                                >
                                                    <div className="flex items-center gap-3">
                                                        {/* Thumbnail */}
                                                        <div 
                                                            onClick={() => p.imgUrl && setPreviewImg(p.imgUrl)}
                                                            className="w-16 h-16 rounded-xl bg-slate-100 border border-slate-300 shrink-0 overflow-hidden flex items-center justify-center cursor-pointer hover:opacity-90"
                                                        >
                                                            {p.imgUrl ? (
                                                                <img 
                                                                    src={p.imgUrl} 
                                                                    loading="lazy"
                                                                    referrerPolicy="no-referrer" 
                                                                    className="w-full h-full object-cover" 
                                                                />
                                                            ) : (
                                                                <Icon name="package" className="text-slate-400" size={28} />
                                                            )}
                                                        </div>

                                                        {/* Info & Expand Toggle */}
                                                        <div 
                                                            className="flex-1 min-w-0 cursor-pointer"
                                                            onClick={() => setExpandedProduct(isExpanded ? null : p.name)}
                                                        >
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded">
                                                                    {p.category || 'สร้อย'}
                                                                </span>
                                                                <span className="text-xs text-slate-500 font-bold">
                                                                    (เคยสั่ง {productLogs.length} ครั้ง)
                                                                </span>
                                                            </div>
                                                            <h3 className="text-sm font-extrabold text-slate-900 truncate mt-1 flex items-center gap-1">
                                                                <span>{p.name}</span>
                                                                <Icon name={isExpanded ? "chevron-up" : "chevron-down"} size={16} className="text-slate-400" />
                                                            </h3>
                                                            <p className="text-xs text-slate-400 font-medium">แตะตรงนี้เพื่อดูประวัติการสั่งผลิต</p>
                                                        </div>

                                                        {/* Direct Order Button */}
                                                        <button 
                                                            onClick={() => {
                                                                setForm({ 
                                                                    ...form, 
                                                                    type: p.category || 'สร้อย', 
                                                                    productName: p.name
                                                                });
                                                                setActiveTab('create');
                                                            }}
                                                            className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-extrabold shrink-0 flex items-center gap-1 transition-all shadow-sm"
                                                        >
                                                            <Icon name="plus" size={14} />
                                                            <span>สั่งผลิต</span>
                                                        </button>
                                                    </div>

                                                    {/* Dropdown Logs Drawer */}
                                                    {isExpanded && (
                                                        <div className="mt-3 pt-3 border-t-2 border-slate-100 space-y-2 bg-slate-50 p-3 rounded-xl animate-pop">
                                                            <div className="flex items-center justify-between text-xs font-bold text-slate-800">
                                                                <span className="flex items-center gap-1">
                                                                    <Icon name="history" size={16} className="text-indigo-600" />
                                                                    <span>ประวัติการสั่งผลิตย้อนหลัง ({productLogs.length} รายการ)</span>
                                                                </span>
                                                            </div>

                                                            {productLogs.length === 0 ? (
                                                                <p className="text-xs text-slate-500 italic py-1">ยังไม่มีประวัติการสั่งผลิตสินค้าชิ้นนี้</p>
                                                            ) : (
                                                                <div className="space-y-2 max-h-48 overflow-y-auto pt-1">
                                                                    {productLogs.map(log => {
                                                                        const badge = getStatusBadge(log.status);
                                                                        return (
                                                                            <div key={log.id} className="bg-white p-2.5 rounded-xl border border-slate-300 text-xs flex items-center justify-between gap-2">
                                                                                <div className="space-y-0.5 min-w-0">
                                                                                    <div className="flex items-center gap-2">
                                                                                        <span className="font-extrabold text-slate-900">จำนวน {log.quantity} ชิ้น</span>
                                                                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${badge.bg}`}>
                                                                                            {badge.label}
                                                                                        </span>
                                                                                    </div>
                                                                                    <div className="text-[11px] text-slate-500 font-medium">
                                                                                        <span>สั่งเมื่อ: {log.timestamp}</span>
                                                                                        {log.status === 'done' && log.doneTimestamp && (
                                                                                            <span className="ml-2 text-emerald-700 font-bold">
                                                                                                • เสร็จ: {log.doneTimestamp} ({log.doneBy || 'พนักงาน'})
                                                                                            </span>
                                                                                        )}
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })
                                    )}
                                </div>

                                {/* Pagination Controls */}
                                {totalProductPages > 1 && (
                                    <div className="saas-card p-3 rounded-2xl bg-white border-2 border-slate-300 flex items-center justify-between text-xs font-extrabold">
                                        <button 
                                            disabled={productPage === 1}
                                            onClick={() => setProductPage(p => Math.max(1, p - 1))}
                                            className="px-4 py-2 bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-800 rounded-xl transition-all flex items-center gap-1"
                                        >
                                            <Icon name="chevron-left" size={16} />
                                            <span>ก่อนหน้า</span>
                                        </button>

                                        <span className="text-slate-600">
                                            หน้า <span className="text-indigo-700 font-black">{productPage}</span> / {totalProductPages}
                                        </span>

                                        <button 
                                            disabled={productPage === totalProductPages}
                                            onClick={() => setProductPage(p => Math.min(totalProductPages, p + 1))}
                                            className="px-4 py-2 bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-800 rounded-xl transition-all flex items-center gap-1"
                                        >
                                            <span>ถัดไป</span>
                                            <Icon name="chevron-right" size={16} />
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {}
                    {/* Mobile Floating Action Button (FAB Navigation Menu) */}
                    <div className="sm:hidden fixed bottom-5 right-5 z-50 flex flex-col items-end gap-2">
                        {showFabMenu && (
                            <div className="flex flex-col gap-2 mb-1 animate-pop">
                                {[
                                    { id: 'orders', label: '1. คิวงานสั่งทำ', icon: 'clipboard-list', color: 'bg-indigo-600 text-white' },
                                    { id: 'create', label: '2. + สั่งงานใหม่', icon: 'plus-circle', color: 'bg-emerald-600 text-white' },
                                    { id: 'products', label: '3. ค้นหารูปสินค้า', icon: 'image', color: 'bg-slate-800 text-white' }
                                ].map(btn => (
                                    <button
                                        key={btn.id}
                                        onClick={() => {
                                            setActiveTab(btn.id);
                                            setShowFabMenu(false);
                                        }}
                                        className={`flex items-center justify-end gap-2 px-4 py-3 rounded-2xl text-xs font-extrabold shadow-xl ${btn.color} ring-2 ring-white/50 active:scale-95 transition-all`}
                                    >
                                        <span>{btn.label}</span>
                                        <Icon name={btn.icon} size={18} />
                                    </button>
                                ))}
                            </div>
                        )}

                        <button
                            onClick={() => setShowFabMenu(!showFabMenu)}
                            className={`w-14 h-14 rounded-full flex items-center justify-center text-white shadow-2xl transition-all active:scale-90 ${
                                showFabMenu ? 'bg-slate-900 rotate-45' : 'bg-indigo-600 ring-4 ring-indigo-200'
                            }`}
                            title="เมนูนำทางด่วน"
                        >
                            <Icon name={showFabMenu ? "x" : "menu"} size={26} />
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
