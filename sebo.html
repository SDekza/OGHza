<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>Work Management - SEBOFFICIAL</title>
    
    <link rel="icon" type="image/png" href="sebo.png">
    <link rel="apple-touch-icon" href="sebo.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f8fafc">
    
    <!-- React & Babel Standalone -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.js"></script>

    <!-- Firebase SDK (v10 UMD) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');
        
        * {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        body { 
            font-family: 'Anuphan', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
            user-select: none; 
            overscroll-behavior-y: contain; 
            touch-action: manipulation;
        }
        
        .saas-shadow { 
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.08), 0 1px 3px rgba(15, 23, 42, 0.02); 
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes modal-pop { 
            0% { transform: scale(0.96); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }
        .animate-modal { animation: modal-pop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .urgent-minimal-card { 
            background-color: #ffffff; 
            border: 1.5px solid #ef4444 !important; 
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.08); 
        }
        
        .navbar-ios {
            padding-top: calc(14px + env(safe-area-inset-top));
            padding-bottom: 14px;
        }

        .bottom-bar-ios {
            padding-bottom: env(safe-area-inset-bottom);
            height: calc(64px + env(safe-area-inset-bottom));
        }

        @keyframes slide-down { 0% { transform: translateY(-100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .animate-slide-down { animation: slide-down 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 25s linear infinite; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useMemo, useRef, memo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCLKMgC5Y_zg97VaWjPVFXpXhp2zon7TP0",
            authDomain: "stock-spare-c9692.firebaseapp.com",
            projectId: "stock-spare-c9692",
            storageBucket: "stock-spare-c9692.firebasestorage.app",
            messagingSenderId: "376839440950",
            appId: "1:376839440950:web:d6d0c583e4eabf107e2697",
            measurementId: "G-0T0KQ5NGEV"
        };

        let db = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            firebase.auth().signInAnonymously().catch(() => {});
        } catch(e) {
            console.warn("Firebase Init Error", e);
        }

        const LucideIcon = memo(({ name, size = 20, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                let active = true;
                if (window.lucide && ref.current) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    ref.current.appendChild(i);
                    const timer = setTimeout(() => {
                        if (active && ref.current) {
                            window.lucide.createIcons({
                                root: ref.current,
                                nameAttr: 'data-lucide',
                                attrs: { width: size, height: size, class: "lucide-icon-svg" }
                            });
                        }
                    }, 0);
                    return () => { active = false; clearTimeout(timer); };
                }
            }, [name, size]);
            return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size, minWidth: size }} />;
        });

        const defaultCategories = ["งานตัด", "งานพับ", "งานสกรีน", "งานประกอบ", "งานแพ็ค", "งานทั่วไป"];

        const generateUUID = () => {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        };

        const App = () => {
            // User Session strictly from localStorage set by login.html
            const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('seb_current_user') || 'Guest');
            const [currentUserRank, setCurrentUserRank] = useState(() => localStorage.getItem('seb_current_rank') || 'Guest');

            // Data State
            const [savedItems, setSavedItems] = useState([]);
            const [masterProducts, setMasterProducts] = useState([]);
            const [categories, setCategories] = useState(defaultCategories);
            const [announcement, setAnnouncement] = useState("");
            const [logsData, setLogsData] = useState([]);

            // UI Navigation State
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('view'); 
            const [viewSubTab, setViewSubTab] = useState('pending'); 
            const [manageSubTab, setManageSubTab] = useState('search');

            // Draft & Form State
            const [draftItems, setDraftItems] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [isCustomProduct, setIsCustomProduct] = useState(false);
            const [form, setForm] = useState({ type: 'งานทั่วไป', productName: '', imageUrl: '', quantity: '1', memo: '', isUrgent: false, isStock: false });
            const [isSaving, setIsSaving] = useState(false);

            // Filters
            const [completedDateFilter, setCompletedDateFilter] = useState(() => {
                const tzoffset = (new Date()).getTimezoneOffset() * 60000;
                return (new Date(Date.now() - tzoffset)).toISOString().split('T')[0];
            });
            const [workTypeFilter, setWorkTypeFilter] = useState('all');
            const [analysisRange, setAnalysisRange] = useState('7d');

            // Tasks Pagination (หน้าละ 10 รายการ เพื่อความเร็วสูงสุด)
            const [taskCurrentPage, setTaskCurrentPage] = useState(1);
            const TASKS_PER_PAGE = 10;

            // Master Products Pagination (หน้าละ 20 รายการ)
            const [productCurrentPage, setProductCurrentPage] = useState(1);
            const PRODUCTS_PER_PAGE = 20;

            // Modals & UI Controls
            const [previewImage, setPreviewImage] = useState(null);
            const [itemToDelete, setItemToDelete] = useState(null);
            const [editTaskItem, setEditTaskItem] = useState(null);
            const [editTaskForm, setEditTaskForm] = useState({ quantity: '1', memo: '', isUrgent: false });
            const [productSearchInput, setProductSearchInput] = useState('');
            const [newProduct, setNewProduct] = useState({ name: '', imageBase64: '', preview: '' });
            const [isEditingMaster, setIsEditingMaster] = useState(false);
            const [masterItemToDelete, setMasterItemToDelete] = useState(null);
            const [showAnnouncementModal, setShowAnnouncementModal] = useState(false);
            const [announcementInput, setAnnouncementInput] = useState("");
            const [editCategoriesMode, setEditCategoriesMode] = useState(false);
            const [tempCategories, setTempCategories] = useState([]);
            const [newCategoryInput, setNewCategoryInput] = useState("");
            const [toastMessage, setToastMessage] = useState(null);

            // Image Zoom & Pan State for Lightbox
            const [imageScale, setImageScale] = useState(1);
            const [imagePosition, setImagePosition] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const dragStartRef = useRef({ x: 0, y: 0 });
            const touchDistanceRef = useRef(null);

            // Migration, Backup & Confirmation Modal State
            const [isMigrating, setIsMigrating] = useState(false);
            const [migrationStatus, setMigrationStatus] = useState('');
            const [isBackingUp, setIsBackingUp] = useState(false);
            const [confirmModal, setConfirmModal] = useState(null);

            const searchContainerRef = useRef(null);

            const showToast = (message) => {
                setToastMessage(message);
                setTimeout(() => setToastMessage(null), 2500);
            };

            // Reset Task Pagination when tab/filters change
            useEffect(() => {
                setTaskCurrentPage(1);
            }, [viewSubTab, workTypeFilter, completedDateFilter]);

            // Prevent Pinch-to-Zoom globally except in Lightbox
            useEffect(() => {
                const preventMultiTouch = (e) => {
                    if (e.touches && e.touches.length > 1) {
                        const lightbox = document.getElementById('lightbox-image-container');
                        if (lightbox && lightbox.contains(e.target)) {
                            return; 
                        }
                        e.preventDefault();
                    }
                };

                const preventGesture = (e) => {
                    const lightbox = document.getElementById('lightbox-image-container');
                    if (lightbox && lightbox.contains(e.target)) {
                        return; 
                    }
                    e.preventDefault();
                };

                document.addEventListener('touchstart', preventMultiTouch, { passive: false });
                document.addEventListener('touchmove', preventMultiTouch, { passive: false });
                document.addEventListener('gesturestart', preventGesture, { passive: false });
                document.addEventListener('gesturechange', preventGesture, { passive: false });
                document.addEventListener('gestureend', preventGesture, { passive: false });

                return () => {
                    document.removeEventListener('touchstart', preventMultiTouch);
                    document.removeEventListener('touchmove', preventMultiTouch);
                    document.removeEventListener('gesturestart', preventGesture);
                    document.removeEventListener('gesturechange', preventGesture);
                    document.removeEventListener('gestureend', preventGesture);
                };
            }, []);

            // Reset image scale when lightbox closes
            useEffect(() => {
                if (!previewImage) {
                    setImageScale(1);
                    setImagePosition({ x: 0, y: 0 });
                }
            }, [previewImage]);

            useEffect(() => {
                if (!db) {
                    setLoading(false);
                    return;
                }

                // 1. Listen Tasks
                const unsubTasks = db.collection("sebo_tasks").onSnapshot(snapshot => {
                    const loadedTasks = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        loadedTasks.push({ id: doc.id, ...data });
                    });
                    loadedTasks.sort((a, b) => (b.timestampMs || 0) - (a.timestampMs || 0));
                    setSavedItems(loadedTasks);
                    setLoading(false);
                }, err => console.error("Tasks sync error", err));

                // 2. Listen Master Products
                const unsubProducts = db.collection("sebo_products").onSnapshot(snapshot => {
                    const loadedProds = [];
                    snapshot.forEach(doc => {
                        loadedProds.push({ id: doc.id, ...doc.data() });
                    });
                    setMasterProducts(loadedProds);
                });

                // 3. Listen Categories
                const unsubCats = db.collection("sebo_settings").doc("categories").onSnapshot(doc => {
                    if (doc.exists && doc.data().list) {
                        setCategories(doc.data().list);
                    } else {
                        db.collection("sebo_settings").doc("categories").set({ list: defaultCategories });
                    }
                });

                // 4. Listen Announcement
                const unsubAnn = db.collection("sebo_settings").doc("announcement").onSnapshot(doc => {
                    if (doc.exists) setAnnouncement(doc.data().message || "");
                });

                // 5. Listen System Logs
                const unsubLogs = db.collection("sebo_logs").onSnapshot(snapshot => {
                    const loadedLogs = [];
                    snapshot.forEach(doc => loadedLogs.push({ id: doc.id, ...doc.data() }));
                    loadedLogs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    setLogsData(loadedLogs);
                });

                return () => {
                    unsubTasks();
                    unsubProducts();
                    unsubCats();
                    unsubAnn();
                    unsubLogs();
                };
            }, []);

            useEffect(() => {
                function handleClickOutside(event) {
                    if (searchContainerRef.current && !searchContainerRef.current.contains(event.target)) {
                        setShowSuggestions(false);
                    }
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, [searchContainerRef]);

            const logAction = async (action, details = "") => {
                if (!db) return;
                try {
                    await db.collection("sebo_logs").add({
                        timestamp: new Date().toLocaleString('th-TH'),
                        createdAt: Date.now(),
                        user: currentUser,
                        action,
                        details
                    });
                } catch(e) {}
            };

            const handleAddToDraft = () => {
                if (currentUserRank === 'Guest') {
                    showToast('สิทธิ์ Guest ไม่สามารถเพิ่มคิวงานได้');
                    return;
                }
                if (!form.productName) return;
                
                const now = new Date();
                const ts = now.toLocaleString('th-TH', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                const newItem = { 
                    ...form, 
                    imageUrl: isCustomProduct ? '' : form.imageUrl, 
                    isDoing: false, 
                    isDone: false, 
                    timestamp: ts, 
                    timestampMs: now.getTime(),
                    uuid: generateUUID(),
                    user: currentUser, 
                    doingBy: '',
                    doneBy: ''
                };

                setDraftItems(prev => [...prev, newItem]);
                setForm({ type: categories[0] || 'งานทั่วไป', productName: '', imageUrl: '', quantity: '1', memo: '', isUrgent: false, isStock: false }); 
                setSearchTerm('');
                setIsCustomProduct(false); 
                showToast('เพิ่มลงคิวงานเรียบร้อยแล้ว');
            };

            const handleSubmitBulk = async () => {
                if (draftItems.length === 0 || !db) return;
                setIsSaving(true);
                
                try {
                    const batch = db.batch();
                    draftItems.forEach(item => {
                        const ref = db.collection("sebo_tasks").doc();
                        batch.set(ref, item);
                    });
                    await batch.commit();
                    
                    await logAction("เพิ่มงานใหม่", `บันทึกคิวงาน ${draftItems.length} รายการ`);
                    setDraftItems([]); 
                    showToast(`บันทึกคิวงานสำเร็จ ${draftItems.length} รายการ!`); 
                } catch (e) { 
                    showToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                } finally {
                    setIsSaving(false);
                }
            };

            const handleStatusToggle = async (item) => {
                if (currentUserRank === 'Guest') {
                    showToast('สิทธิ์ Guest ไม่สามารถเปลี่ยนสถานะได้');
                    return;
                }
                
                if (item.isDoing && item.doingBy && item.doingBy !== currentUser && currentUserRank !== 'Admin' && currentUserRank !== 'Dev') {
                    showToast(`งานนี้กำลังดำเนินการโดย ${item.doingBy}`);
                    return;
                }

                let nextStatus = { isDoing: item.isDoing, isDone: item.isDone };
                if (viewSubTab === 'pending') nextStatus = { isDoing: true, isDone: false };
                else if (viewSubTab === 'doing') nextStatus = { isDoing: false, isDone: true };
                else if (viewSubTab === 'completed') nextStatus = { isDoing: false, isDone: false };

                const updateData = {
                    isDoing: nextStatus.isDoing,
                    isDone: nextStatus.isDone,
                    doingBy: nextStatus.isDoing ? currentUser : (nextStatus.isDone ? (item.doingBy || currentUser) : ''),
                    doneBy: nextStatus.isDone ? currentUser : ''
                };

                try {
                    if (db) {
                        await db.collection("sebo_tasks").doc(item.id).update(updateData);
                    }
                    await logAction("เปลี่ยนสถานะงาน", `${item.productName} -> ${nextStatus.isDone ? 'เสร็จ' : nextStatus.isDoing ? 'กำลังทำ' : 'ค้าง'}`);
                } catch (e) {
                    console.error("Status update failed", e);
                }
            };

            const confirmEditTask = async () => {
                if (!editTaskItem || !db) return;
                const payload = {
                    quantity: editTaskForm.quantity,
                    memo: editTaskForm.memo,
                    isUrgent: editTaskForm.isUrgent
                };

                try {
                    await db.collection("sebo_tasks").doc(editTaskItem.id).update(payload);
                    await logAction("แก้ไขข้อมูลงาน", editTaskItem.productName);
                    showToast('อัปเดตข้อมูลงานแล้ว');
                } catch(e) {}
                setEditTaskItem(null);
            };

            const confirmDeleteTask = async () => {
                if (!itemToDelete || !db) return;
                try {
                    await db.collection("sebo_tasks").doc(itemToDelete.id).delete();
                    await logAction("ลบงาน", itemToDelete.productName);
                    showToast(`ลบ "${itemToDelete.productName}" เรียบร้อยแล้ว`);
                } catch(e) {}
                setItemToDelete(null);
            };

            const handleAddProductMaster = async () => {
                if (currentUserRank === 'Guest' || currentUserRank === 'User' || !db) {
                    showToast("คุณไม่มีสิทธิ์ในการเพิ่มสินค้า");
                    return;
                }
                if (!newProduct.name.trim()) return;
                setIsEditingMaster(true);
                try {
                    const prodData = {
                        name: newProduct.name.trim(),
                        imgUrl: newProduct.imageBase64 || ''
                    };
                    await db.collection("sebo_products").add(prodData);
                    await logAction("เพิ่มสินค้าหลัก", newProduct.name);
                    setNewProduct({ name: '', imageBase64: '', preview: '' });
                    setManageSubTab('search');
                    setProductCurrentPage(1);
                    showToast("บันทึกสินค้าหลักเรียบร้อยแล้ว");
                } catch(e) {
                    console.error("Add master error", e);
                    showToast("เกิดข้อผิดพลาดในการบันทึกสินค้า");
                } finally {
                    setIsEditingMaster(false);
                }
            };

            const confirmDeleteMaster = async (prod) => {
                if (!db || !prod) return;
                try {
                    await db.collection("sebo_products").doc(prod.id).delete();
                    await logAction("ลบสินค้าหลัก", prod.name);
                    showToast(`ลบ "${prod.name}" เรียบร้อยแล้ว`);
                } catch(e) {}
                setMasterItemToDelete(null);
            };

            const handleSaveAnnouncement = async () => {
                setShowAnnouncementModal(false);
                setAnnouncement(announcementInput);
                if (db) {
                    await db.collection("sebo_settings").doc("announcement").set({ message: announcementInput });
                    await logAction("อัปเดตประกาศ", announcementInput);
                }
                showToast("อัปเดตข้อความประกาศแล้ว");
            };

            const handleSaveCategories = async () => {
                setCategories(tempCategories);
                setEditCategoriesMode(false);
                if (db) {
                    await db.collection("sebo_settings").doc("categories").set({ list: tempCategories });
                    await logAction("อัปเดตหมวดหมู่", tempCategories.join(', '));
                }
                showToast("บันทึกหมวดหมู่เรียบร้อยแล้ว");
            };

            // Image Lightbox Interaction Handlers
            const handleMouseDown = (e) => {
                if (imageScale > 1) {
                    setIsDragging(true);
                    dragStartRef.current = { x: e.clientX - imagePosition.x, y: e.clientY - imagePosition.y };
                }
            };

            const handleMouseMove = (e) => {
                if (isDragging && imageScale > 1) {
                    setImagePosition({
                        x: e.clientX - dragStartRef.current.x,
                        y: e.clientY - dragStartRef.current.y
                    });
                }
            };

            const handleMouseUp = () => {
                setIsDragging(false);
            };

            const getTouchDistance = (touches) => {
                return Math.hypot(
                    touches[0].clientX - touches[1].clientX,
                    touches[0].clientY - touches[1].clientY
                );
            };

            const handleTouchStart = (e) => {
                if (e.touches.length === 2) {
                    touchDistanceRef.current = getTouchDistance(e.touches);
                } else if (e.touches.length === 1 && imageScale > 1) {
                    setIsDragging(true);
                    dragStartRef.current = { x: e.touches[0].clientX - imagePosition.x, y: e.touches[0].clientY - imagePosition.y };
                }
            };

            const handleTouchMove = (e) => {
                if (e.touches.length === 2 && touchDistanceRef.current) {
                    const newDist = getTouchDistance(e.touches);
                    const factor = newDist / touchDistanceRef.current;
                    setImageScale(prev => Math.min(Math.max(prev * factor, 1), 4));
                    touchDistanceRef.current = newDist;
                } else if (e.touches.length === 1 && isDragging && imageScale > 1) {
                    setImagePosition({
                        x: e.touches[0].clientX - dragStartRef.current.x,
                        y: e.touches[0].clientY - dragStartRef.current.y
                    });
                }
            };

            const handleTouchEnd = () => {
                setIsDragging(false);
                touchDistanceRef.current = null;
            };

            const handleDoubleTap = () => {
                if (imageScale > 1) {
                    setImageScale(1);
                    setImagePosition({ x: 0, y: 0 });
                } else {
                    setImageScale(2);
                }
            };

            // Trigger Backup Confirmation Popup
            const triggerBackupToGoogleDocs = () => {
                setConfirmModal({
                    type: 'backup',
                    title: 'ยืนยันการสำรองข้อมูล (Backup)',
                    desc: 'ระบบจะทำการดึงข้อมูลล่าสุดจาก Firebase แล้วสร้างเป็นไฟล์เอกสารรายงาน (.doc) สำหรับ Google Docs คุณต้องการดำเนินการต่อหรือไม่?',
                    icon: 'file-text',
                    color: 'emerald',
                    actionText: 'เริ่มสำรองข้อมูล',
                    onConfirm: () => {
                        setConfirmModal(null);
                        executeBackupToGoogleDocs();
                    }
                });
            };

            // Backup Firebase Data into Google Docs format
            const executeBackupToGoogleDocs = async () => {
                setIsBackingUp(true);
                showToast("กำลังดึงข้อมูลจาก Firebase เพื่อสำรองข้อมูล...");

                try {
                    let tasks = savedItems;
                    let products = masterProducts;
                    let cats = categories;
                    let ann = announcement;
                    let logs = logsData;

                    if (db) {
                        const taskSnap = await db.collection("sebo_tasks").get();
                        const freshTasks = [];
                        taskSnap.forEach(doc => freshTasks.push({ id: doc.id, ...doc.data() }));

                    const blob = new Blob([docContent], { type: 'application/msword;charset=utf-8;' });

                    await logAction("สำรองข้อมูลระบบ", `สำรองข้อมูล Firebase ไปยังเอกสาร Google Docs (${tasks.length} งาน, ${products.length} สินค้า)`);

                const SHEET_ID = "108d2PHlbqt5h6p6_O-6qRfGHqs2MNK6GBRjVYdpxAZM";

                    const u = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}&ts=${Date.now()}`;
                    try {
                        const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(u)}`);
                        if (res.ok) return await res.text();
                        const resDirect = await fetch(u);
                        if (resDirect.ok) return await resDirect.text();
                    } catch(e) {}
                    return "";
                };

                const parseCSV = (text) => {
                    if (!text) return [];
                    const result = [];
                    const lines = text.split(/\r?\n/);
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        const row = [];
                        let cur = '';
                        let inQuote = false;
                        for (let j = 0; j < line.length; j++) {
                            const char = line[j];
                            if (char === '"') inQuote = !inQuote;
                            else if (char === ',' && !inQuote) { row.push(cur.trim()); cur = ''; }
                            else cur += char;
                        }
                        row.push(cur.trim());
                        result.push(row);
                    }
                    return result;
                };

                try {
                    setMigrationStatus("กำลังย้ายข้อมูลหมวดหมู่และประกาศ...");

                    const settingsRows = parseCSV(settingsText);

                    settingsRows.slice(1).forEach(row => {
                        if (row[0]) cats.push(row[0].trim());
                    });

                    if (cats.length > 0) {
                        await db.collection("sebo_settings").doc("categories").set({ list: cats });
                    }
                    if (ann) {
                        await db.collection("sebo_settings").doc("announcement").set({ message: ann });
                    }

                    setMigrationStatus("กำลังย้ายข้อมูลสินค้าคลังหลัก...");
                    const masterText = await fetchCsv(MASTER_GID);
                    const masterRows = parseCSV(masterText).slice(1);
                    
                    let masterCount = 0;
                    for (const row of masterRows) {
                        if (row[0]) {
                            const pName = row[0].trim();
                            const pImg = row[1] ? row[1].trim() : '';
                            const formattedImg = pImg.match(/id=([^&]+)/)?.[1] || pImg.match(/\/d\/([^\/]+)/)?.[1] 
                                ? `https://lh3.googleusercontent.com/d/${pImg.match(/id=([^&]+)/)?.[1] || pImg.match(/\/d\/([^\/]+)/)?.[1]}=s400`
                                : pImg;

                            await db.collection("sebo_products").add({
                                name: pName,
                                imgUrl: formattedImg
                            });
                            masterCount++;
                        }
                    }

                    setMigrationStatus("กำลังย้ายข้อมูลรายการงานทั้งหมด...");
                    const recordsText = await fetchCsv(RECORDS_GID);
                    const recordRows = parseCSV(recordsText).slice(2);
                    
                    let taskCount = 0;
                    let batch = db.batch();
                    let bCount = 0;

                    for (const row of recordRows) {
                        if (row.length >= 3 && row[2]) {
                            const dateStr = row[0] || '';
                            let tsMs = Date.now();
                            try {
                                const parts = dateStr.trim().split(' ')[0].match(/(\d+)\/(\d+)\/(\d+)/);
                                if (parts) {
                                    let y = parseInt(parts[3], 10);
                                    if (y > 2400) y -= 543;
                                    tsMs = new Date(y, parseInt(parts[2], 10)-1, parseInt(parts[1], 10)).getTime();
                                }
                            } catch(e) {}

                            const docRef = db.collection("sebo_tasks").doc();
                            batch.set(docRef, {
                                timestamp: dateStr,
                                timestampMs: tsMs,
                                type: row[1] || 'งานทั่วไป',
                                productName: row[2],
                                imageUrl: row[3] || '',
                                quantity: row[4] || '1',
                                isDone: String(row[5]).toUpperCase() === 'TRUE',
                                isDoing: String(row[6]).toUpperCase() === 'TRUE',
                                isUrgent: String(row[7]).toUpperCase() === 'TRUE',
                                memo: row[8] || '',
                                uuid: row[10] || generateUUID(),
                                doingBy: row[11] || '',
                                doneBy: row[12] || '',
                                isStock: String(row[13]).toUpperCase() === 'TRUE',
                                user: row[11] || row[12] || 'Admin'
                            });

                            bCount++;
                            taskCount++;

                            if (bCount >= 400) {
                                await batch.commit();
                                batch = db.batch();
                                bCount = 0;
                            }
                        }
                    }
                    if (bCount > 0) {
                        await batch.commit();
                    }

                    await logAction("ย้ายข้อมูลอัตโนมัติ", `นำเข้าสินค้า ${masterCount} รายการ และงาน ${taskCount} รายการจาก Google Sheets`);
                    showToast(`ย้ายข้อมูลสำเร็จ! สินค้า ${masterCount} รายการ, คิวงาน ${taskCount} รายการ`);

                } catch(e) {
                    console.error("Migration error", e);
                    showToast("เกิดข้อผิดพลาดระหว่างย้ายข้อมูล: " + e.message);
                } finally {
                    setIsMigrating(false);
                    setMigrationStatus('');
                }
            };

            // Filters & Calculations
            const filteredByType = useMemo(() => {
                return savedItems.filter(i => {
                    if (workTypeFilter === 'all') return true;
                    if (workTypeFilter === 'stock') return i.isStock === true;
                    return !i.isStock; 
                });
            }, [savedItems, workTypeFilter]);

            const viewCounts = useMemo(() => {
                const targetDate = new Date(completedDateFilter);
                targetDate.setHours(0,0,0,0);
                const targetTime = targetDate.getTime();
                
                let pending = 0, doing = 0, completed = 0;

                filteredByType.forEach(i => {
                    if (!i.isDoing && !i.isDone) pending++;
                    else if (i.isDoing && !i.isDone) doing++;
                    else if (i.isDone) {
                        const td = new Date(i.timestampMs || 0);
                        td.setHours(0,0,0,0);
                        if (td.getTime() === targetTime) completed++;
                    }
                });

                return { pending, doing, completed };
            }, [filteredByType, completedDateFilter]);

            const filteredItemsRender = useMemo(() => {
                const targetDate = new Date(completedDateFilter);
                targetDate.setHours(0,0,0,0);
                const targetTime = targetDate.getTime();

                    if (viewSubTab === 'pending') return !i.isDoing && !i.isDone;
                    if (viewSubTab === 'doing') return i.isDoing && !i.isDone;
                    if (viewSubTab === 'completed') {
                        if (!i.isDone) return false;
                        const td = new Date(i.timestampMs || 0);
                        td.setHours(0,0,0,0);
                        return td.getTime() === targetTime;
                    }
                    return false;
                });
            }, [filteredByType, viewSubTab, completedDateFilter]);

            const totalPendingCount = useMemo(() => savedItems.filter(i => !i.isDoing && !i.isDone).length, [savedItems]);

            // Tasks Pagination Logic (หน้าละ 10 รายการ)
            const totalTaskPages = Math.ceil(filteredItemsRender.length / TASKS_PER_PAGE) || 1;

            }, [filteredItemsRender, taskCurrentPage]);

                let startDate = new Date(0);

                if (analysisRange === 'today') startDate = todayStart;

                else if (analysisRange === '30d') startDate = new Date(todayStart.setDate(todayStart.getDate() - 29));

                let totalQtyFiltered = 0;
                let totalRecordsFiltered = 0;

                savedItems.forEach(i => {
                    const itemTime = i.timestampMs || 0;
                    if (itemTime >= startDate.getTime()) {
                        totalRecordsFiltered++;
                        const qty = parseInt(i.quantity) || 0;
                        totalQtyFiltered += qty;

                        if (!agg[i.productName]) agg[i.productName] = { name: i.productName, qty: 0, image: i.imageUrl };
                        agg[i.productName].qty += qty;

                            if (!userPerformance[i.doneBy]) userPerformance[i.doneBy] = 0;
                            userPerformance[i.doneBy] += qty;

                    }
                });

                    totalQty: totalQtyFiltered,
                    totalRecords: totalRecordsFiltered,

            const renderMenuTabs = () => {

                    { id: 'record', label: 'บันทึก', icon: 'edit-3', show: currentUserRank !== 'Guest' },

                    { id: 'manage', label: 'สินค้า', icon: 'package', show: true },

                    {/* Announcement Banner */}

                        {activeTab === 'record' && currentUserRank !== 'Guest' && (

                                {isSaving && (

                                {/* Top Controls Toolbar */}
                                <div className="absolute top-3 left-3 right-3 z-10 flex justify-between items-center pointer-events-auto">
                                    <div className="bg-slate-900/80 text-white px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-md border border-slate-700">
                                        ซูม: {Math.round(imageScale * 100)}%
                                    </div>
                                    <div className="flex items-center gap-1.5 bg-slate-900/80 p-1 rounded-full border border-slate-700 backdrop-blur-md">
                                        <button 
                                            onClick={() => setImageScale(s => Math.min(s + 0.5, 4))}
                                            className="w-8 h-8 rounded-full bg-slate-800 text-white flex items-center justify-center hover:bg-slate-700 active:scale-90 transition-all"
                                            title="ขยาย"
                                        >
                                            <LucideIcon name="zoom-in" size={16} />
                                        </button>
                                        <button 
                                            onClick={() => { setImageScale(1); setImagePosition({ x: 0, y: 0 }); }}
                                            className="w-8 h-8 rounded-full bg-slate-800 text-white flex items-center justify-center hover:bg-slate-700 active:scale-90 transition-all text-[10px] font-bold"
                                            title="รีเซ็ต"
                                        >
                                            1:1
                                        </button>
                                        <button 
                                            onClick={() => setImageScale(s => Math.max(s - 0.5, 1))}
                                            className="w-8 h-8 rounded-full bg-slate-800 text-white flex items-center justify-center hover:bg-slate-700 active:scale-90 transition-all"
                                            title="ย่อ"
                                        >
                                            <LucideIcon name="zoom-out" size={16} />
                                        </button>
                                        <button 
                                            onClick={() => setPreviewImage(null)}
                                            className="w-8 h-8 rounded-full bg-rose-600/90 text-white flex items-center justify-center hover:bg-rose-600 active:scale-90 transition-all ml-1"
                                            title="ปิด"
                                        >
                                            <LucideIcon name="x" size={16} />
                                        </button>
                                    </div>
                                </div>

                                {/* Zoomable Image Container */}
                                <div 
                                    className="w-full h-full flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing touch-none select-none"
                                    onMouseDown={handleMouseDown}
                                    onMouseMove={handleMouseMove}
                                    onMouseUp={handleMouseUp}
                                    onTouchStart={handleTouchStart}
                                    onTouchMove={handleTouchMove}
                                    onTouchEnd={handleTouchEnd}
                                    onDoubleClick={handleDoubleTap}
                                >
                                    <img 
                                        src={previewImage} 
                                        referrerPolicy="no-referrer" 
                                        className="max-w-full max-h-full object-contain rounded-xl transition-transform duration-75 ease-out pointer-events-none" 
                                        style={{
                                            transform: `translate(${imagePosition.x}px, ${imagePosition.y}px) scale(${imageScale})`
                                        }}
                                    />
                                </div>
                                <p className="absolute bottom-2 text-[10px] text-slate-400 font-medium bg-slate-900/60 px-2.5 py-0.5 rounded-full pointer-events-none">
                                    แตะ 2 ครั้งเพื่อซูมเข้า/ออก หรือใช้ปุ่มควบคุมด้านบน
                                </p>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
