<!DOCTYPE html>
<html lang="th">
<head>

    <link rel="icon" type="image/png" href="sebo.png">
    <link rel="apple-touch-icon" href="sebo.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f8fafc">
    
    <!-- Stable UMD React, ReactDOM, Babel Standalone & UI Libraries -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Anuphan', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
            user-select: none; 
            overscroll-behavior-y: contain; 
        }
        
        .saas-shadow { 
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.05), 0 1px 3px rgba(15, 23, 42, 0.02); 
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes modal-pop { 
            0% { transform: scale(0.98); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }
        .animate-modal { animation: modal-pop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes shake { 
            10%, 90% { transform: translate3d(-1px, 0, 0); } 
            20%, 80% { transform: translate3d(1px, 0, 0); } 
            30%, 50%, 70% { transform: translate3d(-2px, 0, 0); } 
            40%, 60% { transform: translate3d(2px, 0, 0); } 
        }
        .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        
        .urgent-minimal-card { 
            background-color: #ffffff; 
            border: 1.5px solid #ef4444 !important; 
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.06); 
        }
        
        .navbar-ios {
            padding-top: calc(14px + env(safe-area-inset-top));
            padding-bottom: 14px;
        }

        .bottom-bar-ios {
            padding-bottom: env(safe-area-inset-bottom);
            height: calc(64px + env(safe-area-inset-bottom));
        }

        @keyframes slide-down { 0% { transform: translateY(-100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .animate-slide-down { animation: slide-down 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 25s linear infinite; }

        .top-safe-toast { top: env(safe-area-inset-top); }

        .pin-dot { transition: all 0.2s; }
        .pin-dot.filled { background-color: #6366f1; transform: scale(1.1); }
        .pin-dot.empty { background-color: #f1f5f9; border: 2px solid #cbd5e1; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useMemo, useRef, memo } = React;

        const LucideIcon = memo(({ name, size = 20, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                let active = true;
                if (window.lucide && ref.current) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    ref.current.appendChild(i);
                    
                    const timer = setTimeout(() => {
                        if (active && ref.current) {
                            window.lucide.createIcons({
                                root: ref.current,
                                nameAttr: 'data-lucide',
                                attrs: { width: size, height: size, class: "lucide-icon-svg" }
                            });
                        }
                    }, 0);
                    return () => {
                        active = false;
                        clearTimeout(timer);
                    };
                }
            }, [name, size]);
            return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size, minWidth: size }} />;
        });

        const getAvatarColor = (idx) => {
            const colors = ['bg-indigo-500', 'bg-slate-600', 'bg-sky-600', 'bg-violet-600', 'bg-slate-500', 'bg-indigo-600'];
            return colors[idx % colors.length];
        };

        const formatDriveUrl = (url) => {
            if (!url) return '';
            const id = url.match(/id=([^&]+)/)?.[1] || url.match(/\/d\/([^/]+)/)?.[1];
            return id ? `https://lh3.googleusercontent.com/d/${id}=s400` : url;
        };

        const parseCSV = (text) => {
            if (!text) return [];
            const result = [];
            const lines = text.split(/\r?\n/);
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const row = [];
                let cur = '';
                let inQuote = false;
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuote = !inQuote;
                    } else if (char === ',' && !inQuote) {
                        row.push(cur.trim());
                        cur = '';
                    } else {
                        cur += char;
                    }
                }
                row.push(cur.trim());
                result.push(row);
            }
            return result;
        };

        const parseThaiDate = (dateStr) => {
            if (!dateStr) return new Date(0); 
            try {
                const cleanStr = dateStr.trim();
                const parts = cleanStr.split(' ')[0].match(/(\d+)\/(\d+)\/(\d+)/);
                if (parts) {
                    const d = parseInt(parts[1], 10);
                    const m = parseInt(parts[2], 10) - 1;
                    let y = parseInt(parts[3], 10);
                    if (y > 2400) y -= 543; 
                    return new Date(y, m, d);
                }
                return new Date(cleanStr); 
            } catch (e) { 
                return new Date(0); 
            }
        };

        const generateUUID = () => {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        };

        const App = () => {
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2k5sbWJI52Psj6FlXTOqLY6uUqZmP6VeFsaY1Qhnl9Ky7dCuiS3zeKUS2cDN1n4w/exec"; 
            
            const SHEET_ID = "108d2PHlbqt5h6p6_O-6qRfGHqs2MNK6GBRjVYdpxAZM";
            const MASTER_GID = "519893714"; 
            const RECORDS_GID = "379151214";
            const SETTINGS_GID = "1966833161"; 
            const LOGS_GID = "2045434061"; 

            const [masterProducts, setMasterProducts] = useState([]);
            const [usersData, setUsersData] = useState([]); 
            const [categories, setCategories] = useState([]);
            const [savedItems, setSavedItems] = useState([]);
            const [announcement, setAnnouncement] = useState("");
            
            const [draftItems, setDraftItems] = useState([]);
            
            const [loading, setLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState(null);
            const [recordsLoading, setRecordsLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('view'); 
            const [viewSubTab, setViewSubTab] = useState('pending'); 
            const [manageSubTab, setManageSubTab] = useState('search');
            
            // Check local authentication state from index.html portal
            const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('seb_current_user') || ''); 
            const [currentUserRank, setCurrentUserRank] = useState(() => localStorage.getItem('seb_current_rank') || 'Guest'); 
            const [showUserModal, setShowUserModal] = useState(() => !localStorage.getItem('seb_current_user')); 
            
            const [modalStep, setModalStep] = useState('select'); 
            const [selectedTempUser, setSelectedTempUser] = useState(null);
            const [passwordInput, setPasswordInput] = useState('');
            const [passError, setPassError] = useState(false);
            
            const [newPasswordInput, setNewPasswordInput] = useState('');
            const [confirmPasswordInput, setConfirmPasswordInput] = useState('');
            const [setPasswordError, setSetPasswordError] = useState('');
            const [activeSetPassField, setActiveSetPassField] = useState('new');
            const [isRegistering, setIsRegistering] = useState(false);

            const [searchTerm, setSearchTerm] = useState('');
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [isCustomProduct, setIsCustomProduct] = useState(false);
            const [form, setForm] = useState({ type: '', productName: '', imageUrl: '', quantity: '1', memo: '', isUrgent: false, isStock: false });
            const [isSaving, setIsSaving] = useState(false);
            
            const [previewImage, setPreviewImage] = useState(null);
            const [itemToDelete, setItemToDelete] = useState(null);
            const [undoTimer, setUndoTimer] = useState(null);
            const [undoItem, setUndoItem] = useState(null);
            
            const [exitingItems, setExitingItems] = useState(new Set());
            const [productSearchInput, setProductSearchInput] = useState('');
            const [newProduct, setNewProduct] = useState({ name: '', imageBase64: '', imageType: '', preview: '' });
            const [isEditingMaster, setIsEditingMaster] = useState(false);
            const [editMasterItem, setEditMasterItem] = useState(null);
            const [masterItemToDelete, setMasterItemToDelete] = useState(null);
            
            const [editTaskItem, setEditTaskItem] = useState(null);
            const [editTaskForm, setEditTaskForm] = useState({ quantity: '1', memo: '', isUrgent: false });
            
            const [completedDateFilter, setCompletedDateFilter] = useState(() => {
                const tzoffset = (new Date()).getTimezoneOffset() * 60000;
                return (new Date(Date.now() - tzoffset)).toISOString().split('T')[0];
            });

            const [analysisRange, setAnalysisRange] = useState('7d'); 
            const [visiblePasswords, setVisiblePasswords] = useState(new Set());
            const [editUserRankModal, setEditUserRankModal] = useState(null);
            const [editUserPassModal, setEditUserPassModal] = useState(null);
            const [newPassValue, setNewPassValue] = useState('');
            const [devActionModal, setDevActionModal] = useState(null);
            const [isDevWorking, setIsDevWorking] = useState(false);
            const [devPassInput, setDevPassInput] = useState('');
            
            const [logsData, setLogsData] = useState([]);
            const [logsLoading, setLogsLoading] = useState(false);
            const [showLogs, setShowLogs] = useState(false);
            const [isGlobalRefreshing, setIsGlobalRefreshing] = useState(false);
            
            const [toastMessage, setToastMessage] = useState(null);
            const [showUndo, setShowUndo] = useState(false);
            
            const [showAnnouncementModal, setShowAnnouncementModal] = useState(false);
            const [announcementInput, setAnnouncementInput] = useState("");

            const [editCategoriesMode, setEditCategoriesMode] = useState(false);
            const [tempCategories, setTempCategories] = useState([]);
            const [newCategoryInput, setNewCategoryInput] = useState("");
            
            const [editingCatIndex, setEditingCatIndex] = useState(null);
            const [editCatText, setEditCatText] = useState("");
            
            const [workTypeFilter, setWorkTypeFilter] = useState('all');

            const searchContainerRef = useRef(null);

            const [pullY, setPullY] = useState(0);
            const [isPullRefreshing, setIsPullRefreshing] = useState(false);
            const PULL_THRESHOLD = 75;

            const fetchCsvData = async (gid) => {
                const u = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}&ts=${Date.now()}`;
                try { 
                    const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(u)}`);
                    if (!response.ok) throw new Error("Proxy fetch failed");
                    return await response.text();
                } catch(e) { 
                    try {
                        const responseDirect = await fetch(u);
                        if (!responseDirect.ok) throw new Error("Direct fetch failed");
                        return await responseDirect.text();
                    } catch(err) { return ""; }
                }
            };

            const fetchData = async () => {
                setErrorMsg(null);
                try {
                    const [masterText, settingsText] = await Promise.all([ 
                        fetchCsvData(MASTER_GID), 
                        fetchCsvData(SETTINGS_GID) 
                    ]);

                    if (!settingsText) throw new Error("ไม่สามารถโหลดข้อมูลผู้ใช้ได้");

                    const products = parseCSV(masterText).slice(1).map(row => (row[0] ? { name: row[0].trim(), imgUrl: formatDriveUrl(row[1]) } : null)).filter(Boolean);
                    setMasterProducts(products);

                    const cats = [], usrs = [];
                    const settingsRows = parseCSV(settingsText);
                    
                    if (settingsRows.length > 1 && settingsRows[1][4]) {
                        setAnnouncement(settingsRows[1][4]);
                    }

                    settingsRows.slice(1).forEach(row => {
                        if (row[0]) cats.push(row[0].trim());
                        if (row[1]) usrs.push({ name: row[1].trim(), pass: (row[2] || "").trim(), rank: (row[3] || "User").trim() });
                    });
                    setCategories(cats); 
                    setUsersData(usrs);
                    if (cats.length > 0) setForm(prev => ({ ...prev, type: prev.type || cats[0] }));
                } catch(e) {
                    setErrorMsg(e.message);
                } finally { 
                    setLoading(false); 
                }
            };

            const fetchSavedRecords = async () => {
                setRecordsLoading(true);
                try {
                    const text = await fetchCsvData(RECORDS_GID);
                    const records = parseCSV(text).slice(2).map((row, index) => {
                        if (row.length < 3) return null;
                        const dateObj = parseThaiDate(row[0]);
                        return {
                            id: index, 
                            timestamp: row[0], 
                            timestampMs: dateObj.getTime(),
                            type: row[1], 
                            productName: row[2], 
                            imageUrl: row[3], 
                            quantity: row[4],
                            isDone: String(row[5]).toUpperCase() === 'TRUE',
                            isDoing: String(row[6]).toUpperCase() === 'TRUE',
                            isUrgent: String(row[7]).toUpperCase() === 'TRUE',
                            memo: row[8],
                            uuid: row[10],
                            doingBy: row[11] || '',
                            doneBy: row[12] || '',
                            isStock: String(row[13]).toUpperCase() === 'TRUE'
                        };
                    }).filter(Boolean);
                    setSavedItems(records);
                } finally { setRecordsLoading(false); }
            };

            const fetchLogs = async () => {
                setLogsLoading(true);
                try {
                    const text = await fetchCsvData(LOGS_GID);
                    const rows = parseCSV(text).slice(1);
                    const formatted = rows.map((r, i) => ({
                        id: i,
                        timestamp: r[0],
                        user: r[1],
                        action: r[2],
                        details: r[3]
                    })).reverse();
                    setLogsData(formatted);
                    setShowLogs(true);
                } catch(e) { console.error(e); }
                finally { setLogsLoading(false); }
            };

            const handleGlobalRefresh = async () => {
                setIsGlobalRefreshing(true);
                await Promise.all([fetchData(), fetchSavedRecords()]);
                setIsGlobalRefreshing(false);
            };

            const showToast = (message, isUndoable = false) => {
                setToastMessage(message);
                setShowUndo(isUndoable);
                setTimeout(() => {
                     if (!isUndoable) setToastMessage(null);
                }, 2500); 
            };

            const handleUndoDelete = () => {
                if (undoTimer) clearTimeout(undoTimer);
                if (undoItem) {
                    setSavedItems(prev => [...prev, undoItem]);
                    setToastMessage(null);
                    setShowUndo(false);
                    setUndoItem(null);
                }
            };

            const copyToClipboard = (text) => {
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                    showToast(`คัดลอกข้อความแล้ว`);
                } catch(e) {
                    showToast(`คัดลอกแล้ว`);
                }
            };
            
            const handleEditAnnouncementClick = () => {
                if (currentUserRank === 'Admin' || currentUserRank === 'Dev') {
                    setAnnouncementInput(announcement || "");
                    setShowAnnouncementModal(true);
                }
            };

            const handleSaveAnnouncement = async () => {
                setAnnouncement(announcementInput);
                setShowAnnouncementModal(false);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                         method: "POST", mode: "no-cors",
                         body: JSON.stringify({ action: 'update_announcement', message: announcementInput, user: currentUser })
                    });
                } catch(e) {}
            };

            const handleSaveCategories = async () => {
                setCategories(tempCategories);
                setEditCategoriesMode(false);
                try {
                     await fetch(GOOGLE_SCRIPT_URL, {
                         method: "POST", mode: "no-cors",
                         body: JSON.stringify({ action: 'update_categories', categories: tempCategories, user: currentUser })
                    });
                } catch(e) {}
            };

            const handleAddCategory = () => {
                if (newCategoryInput && !tempCategories.includes(newCategoryInput)) {
                    setTempCategories([...tempCategories, newCategoryInput]);
                    setNewCategoryInput("");
                }
            };
            
            const handleDeleteCategory = (cat) => {
                setTempCategories(tempCategories.filter(c => c !== cat));
            };

            const startEditCategory = (index, currentText) => {
                setEditingCatIndex(index);
                setEditCatText(currentText);
            };

            const saveEditCategory = () => {
                if (editCatText.trim() === '') return;
                const newCats = [...tempCategories];
                newCats[editingCatIndex] = editCatText.trim();
                setTempCategories(newCats);
                setEditingCatIndex(null);
            };

            useEffect(() => {
                function handleClickOutside(event) {
                    if (searchContainerRef.current && !searchContainerRef.current.contains(event.target)) {
                        setShowSuggestions(false);
                    }
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => {
                    document.removeEventListener("mousedown", handleClickOutside);
                };
            }, [searchContainerRef]);

            useEffect(() => { 
                fetchData(); fetchSavedRecords();
                const u = localStorage.getItem('seb_current_user');
                if (u) { 
                    setCurrentUser(u); 
                    setCurrentUserRank(localStorage.getItem('seb_current_rank') || 'User'); 
                    setShowUserModal(false); 
                }
            }, []);

            const handleUserSelect = (userObj) => {
                if (userObj.rank === 'Guest' || userObj.pass === 'guest') {
                    setCurrentUser(userObj.name);
                    setCurrentUserRank('Guest');
                    localStorage.setItem('seb_current_user', userObj.name);
                    localStorage.setItem('seb_current_rank', 'Guest');
                    setShowUserModal(false);
                    setActiveTab('view');
                    return;
                }
                const passLower = String(userObj.pass || "").toLowerCase().trim();
                if (passLower === "" || passLower === "none") {
                    setSelectedTempUser(userObj);
                    setModalStep('set-password');
                    setNewPasswordInput('');
                    setConfirmPasswordInput('');
                    setSetPasswordError('');
                    setActiveSetPassField('new'); 
                } else {
                    setSelectedTempUser(userObj);
                    setModalStep('password');
                    setPasswordInput('');
                    setPassError(false);
                }
            };

            const handleNumInput = (num) => {
                if (modalStep === 'password') {
                    if (passwordInput.length < 4) {
                        const newVal = passwordInput + num;
                        setPasswordInput(newVal);
                        if (newVal.length === 4) {
                            if (newVal === String(selectedTempUser.pass)) {
                                setCurrentUser(selectedTempUser.name);
                                setCurrentUserRank(selectedTempUser.rank);
                                localStorage.setItem('seb_current_user', selectedTempUser.name);
                                localStorage.setItem('seb_current_rank', selectedTempUser.rank);
                                setShowUserModal(false);
                                setModalStep('select');
                                setSelectedTempUser(null);
                                setActiveTab('record');
                            } else {
                                setPassError(true);
                                setTimeout(() => { setPassError(false); setPasswordInput(''); }, 500);
                            }
                        }
                    }
                } else if (modalStep === 'set-password') {
                    if (activeSetPassField === 'new') {
                        if (newPasswordInput.length < 4) setNewPasswordInput(prev => prev + num);
                    } else {
                        if (confirmPasswordInput.length < 4) setConfirmPasswordInput(prev => prev + num);
                    }
                }
            };

            const handleNumDelete = () => {
                if (modalStep === 'password') {
                    setPasswordInput(prev => prev.slice(0, -1));
                } else if (modalStep === 'set-password') {
                    if (activeSetPassField === 'new') setNewPasswordInput(prev => prev.slice(0, -1));
                    else setConfirmPasswordInput(prev => prev.slice(0, -1));
                }
            };

            const renderPinDots = (value, length = 4, isActive = true) => {
                return (
                    <div className="flex gap-4 justify-center mb-6">
                        {[...Array(length)].map((_, i) => (
                            <div key={i} className={`w-3.5 h-3.5 rounded-full border transition-all duration-200 ${i < value.length ? 'bg-indigo-500 border-indigo-500 scale-105 pin-dot filled' : isActive ? 'border-slate-300 bg-slate-100 pin-dot empty' : 'border-slate-200 bg-transparent pin-dot'}`}></div>
                        ))}
                    </div>
                );
            };

            const handleSetNewPassword = async () => {
                if (newPasswordInput.length !== 4) { setSetPasswordError('กรุณาตั้งรหัสผ่านตัวเลข 4 หลัก'); return; }
                if (newPasswordInput !== confirmPasswordInput) { setSetPasswordError('รหัสผ่านไม่ตรงกัน'); return; }
                setIsRegistering(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST", mode: "no-cors",
                        body: JSON.stringify({ action: 'update_user_setting', targetUser: selectedTempUser.name, rank: selectedTempUser.rank, pass: newPasswordInput, user: 'System' })
                    });
                    setCurrentUser(selectedTempUser.name);
                    setCurrentUserRank(selectedTempUser.rank);
                    localStorage.setItem('seb_current_user', selectedTempUser.name);
                    localStorage.setItem('seb_current_rank', selectedTempUser.rank);
                    setShowUserModal(false);
                    setModalStep('select');
                    setSelectedTempUser(null);
                    setTimeout(fetchData, 1000); 
                } catch (e) {
                    setSetPasswordError('เกิดข้อผิดพลาด กรุณาลองใหม่');
                } finally {
                    setIsRegistering(false);
                }
            };

            const handleInputChange = (e) => {
                const val = e.target.value;
                setSearchTerm(val);
                setForm(prev => ({ ...prev, productName: val }));
                setShowSuggestions(true);
            };

            const handleAddToDraft = () => {
                if (currentUserRank === 'Guest') return;
                if (!form.productName) return;
                
                const ts = new Date().toLocaleString('th-TH', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const uuid = generateUUID(); 
                
                const newItem = { 
                    ...form, 
                    imageUrl: isCustomProduct ? '' : form.imageUrl, 
                    isDoing: false, 
                    isDone: false, 
                    timestamp: ts, 
                    user: currentUser, 
                    uuid: uuid,
                    isStock: form.isStock
                };

                setDraftItems(prev => [...prev, newItem]);
                
                setForm({ ...form, productName: '', imageUrl: '', quantity: '1', memo: '', isUrgent: false, isStock: false }); 
                setSearchTerm('');
                setIsCustomProduct(false); 
                showToast('เพิ่มลงคิวงานแล้ว', false);
            };

            const handleRemoveFromDraft = (index) => {
                setDraftItems(prev => prev.filter((_, i) => i !== index));
            };

            const handleSubmitBulk = async () => {

                setTimeout(async () => {
                    let nextStatus = { isDoing: item.isDoing, isDone: item.isDone };

                    setSavedItems(p => p.map(i => (i.timestamp === item.timestamp && i.productName === item.productName) ? { 
                        ...i, 
                        ...nextStatus,
                        doingBy: nextStatus.isDoing ? currentUser : (nextStatus.isDone ? i.doingBy : ''), 
                        doneBy: nextStatus.isDone ? currentUser : ''
                    } : i));
                    
                    setExitingItems(p => { const n = new Set(p); n.delete(key); return n; });
                    try {
                        await fetch(GOOGLE_SCRIPT_URL, { 
                            method: "POST", mode: "no-cors", 
                            body: JSON.stringify({ 
                                action: 'update_status_3way', 
                                productName: item.productName, 
                                timestamp: item.timestamp,

                yesterdayStart.setDate(yesterdayStart.getDate() - 1);

                let startDate = new Date(0); 
                let endDate = new Date(9999, 11, 31);

                if (analysisRange === 'today') {
                    startDate = todayStart;
                } else if (analysisRange === 'yesterday') {
                    startDate = yesterdayStart;
                    endDate = todayStart;

                } else if (analysisRange === '30d') {
                    startDate = new Date(todayStart);

                let totalQtyFiltered = 0;
                let totalRecordsFiltered = 0;

                savedItems.forEach(i => {

                                        <label className="text-[9px] tracking-widest text-slate-400 uppercase font-bold">หมายเหตุเพิ่มเติม</label>
                                        <input type="text" className="w-full h-12 bg-slate-50 border border-slate-200 focus:border-indigo-500 rounded-xl px-4 text-xs outline-none transition-all font-medium" value={editTaskForm.memo} onChange={(e) => setEditTaskForm(p => ({...p, memo: e.target.value}))} placeholder="เพิ่มหมายเหตุ..." />
                                    </div>

                                    <button onClick={() => setEditTaskForm(p => ({...p, isUrgent: !p.isUrgent}))} className={`w-full h-12 rounded-xl text-xs font-semibold border transition-all active:scale-95 flex items-center justify-center gap-2 ${editTaskForm.isUrgent ? 'bg-red-50 border-red-300 text-red-700' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                        <LucideIcon name="flame" size={14} /> {editTaskForm.isUrgent ? 'สถานะ: ด่วนพิเศษ 🔥' : 'สถานะ: ระดับปกติ'}
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 gap-3 font-semibold">
                                    <button onClick={() => setEditTaskItem(null)} className="h-11 rounded-xl text-slate-500 bg-slate-100 uppercase text-xs active:scale-95 transition-all">ยกเลิก</button> 
                                    <button onClick={confirmEditTask} className="h-11 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs tracking-wider uppercase flex items-center justify-center gap-1.5"><LucideIcon name="save" size={13} /> บันทึก</button> 
                                </div>
                            </div> 
                        </div> 
                    )}

                    {/* Delete Task Item Confirmation Modal */}
                    {itemToDelete && ( 
                        <div className="fixed inset-0 z-[250] bg-slate-950/40 flex items-center justify-center p-4 backdrop-blur-sm animate-modal text-center font-bold"> 
                            <div className="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full border border-slate-200"> 
                                <LucideIcon name="trash-2" size={48} className="text-red-500 mx-auto mb-4" /> 
                                <h3 className="font-semibold text-lg text-slate-800 mb-1">ลบรายการงานออก?</h3> 
                                <p className="text-slate-400 text-xs mb-8 truncate font-semibold">{itemToDelete.productName}</p> 
                                <div className="grid grid-cols-2 gap-3 font-semibold"> 
                                    <button onClick={() => setItemToDelete(null)} className="h-11 rounded-xl text-slate-500 bg-slate-100 hover:bg-slate-200 transition-colors uppercase text-xs tracking-wider">ยกเลิก</button> 
                                    <button onClick={confirmDelete} className="h-11 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 shadow-md uppercase text-xs tracking-wider">ยืนยัน</button> 
                                </div> 
                            </div> 
                        </div> 
                    )}

                    {/* Delete Master Product Modal */}
                    {masterItemToDelete && ( 
                        <div className="fixed inset-0 z-[250] bg-slate-950/40 flex items-center justify-center p-4 animate-modal text-center font-semibold"> 
                            <div className="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full border border-slate-200 text-center font-bold"> 
                                <LucideIcon name="alert-triangle" size={48} className="text-red-500 mx-auto mb-4" /> 
                                <h3 className="font-semibold text-lg text-slate-800 mb-8">ลบสินค้าชิ้นนี้จากระบบคลังหลัก?</h3> 
                                <div className="grid grid-cols-2 gap-3 font-semibold"> 
                                    <button onClick={() => setMasterItemToDelete(null)} className="h-11 rounded-xl text-slate-500 bg-slate-100 hover:bg-slate-200 transition-colors uppercase text-xs tracking-wider">ยกเลิก</button> 
                                    <button onClick={() => confirmDeleteMaster(masterItemToDelete)} className="h-11 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 shadow-md uppercase text-xs tracking-wider">ลบทันที</button> 
                                </div> 
                            </div> 
                        </div> 
                    )}

                    {/* Image Preview Overlay */}
                    {previewImage && ( 
                        <div className="fixed inset-0 z-[400] bg-slate-950/90 flex items-center justify-center p-4 shadow-xl" onClick={() => setPreviewImage(null)}> 
                            <div className="bg-white p-2 rounded-2xl max-w-xl max-h-[85vh] overflow-hidden relative shadow-2xl border border-slate-200 animate-modal"> 
                                <button className="absolute top-4 right-4 bg-slate-900/60 text-white p-2 rounded-full hover:bg-slate-900 transition-colors"><LucideIcon name="x" size={16}/></button> 
                                <img src={previewImage} className="w-full h-full object-contain rounded-xl" /> 
                            </div> 
                        </div> 
                    )}

                    {/* Announcement Edit Modal */}
                    {showAnnouncementModal && (
                        <div className="fixed inset-0 z-[500] bg-slate-950/40 flex items-center justify-center p-4 backdrop-blur-sm animate-modal">
                             <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-xl max-w-sm w-full border border-slate-200 text-center font-semibold">
                                <div className="flex items-center gap-3 mb-5 text-left">
                                    <div className="p-2 bg-slate-100 text-slate-700 rounded-lg"><LucideIcon name="megaphone" size={18} /></div>
                                    <h3 className="font-semibold text-lg text-slate-800">จัดการประกาศสำคัญ</h3>
                                </div>
                                <textarea 
                                    className="w-full h-28 p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 text-xs text-slate-700 resize-none transition-colors font-medium" 
                                    placeholder="ใส่ข้อความประกาศแจ้งเตือนพนักงาน (เว้นว่างเพื่อลบแถบประกาศ)" 
                                    value={announcementInput} 
                                    onChange={(e) => setAnnouncementInput(e.target.value)}
                                ></textarea>
                                <div className="grid grid-cols-2 gap-3 mt-5">
                                    <button onClick={() => setShowAnnouncementModal(false)} className="py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-500 font-semibold uppercase text-xs tracking-wider transition-colors">ยกเลิก</button>
                                    <button onClick={handleSaveAnnouncement} className="py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold uppercase text-xs tracking-wider shadow-sm transition-colors">บันทึกข้อความ</button>
                                </div>
                             </div>
                        </div>
                    )}
                    
                    {/* Category Management Modal */}
                    {editCategoriesMode && (
                        <div className="fixed inset-0 z-[500] bg-slate-950/40 flex items-center justify-center p-4 backdrop-blur-sm animate-modal">
                             <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-xl max-w-sm w-full border border-slate-200 h-[70vh] flex flex-col font-semibold">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="font-semibold text-md text-slate-800 tracking-wider uppercase">จัดการหมวดหมู่สินค้า</h3>
                                    <button onClick={() => setEditCategoriesMode(false)} className="p-1.5 bg-slate-100 rounded-full hover:bg-slate-200 transition-colors"><LucideIcon name="x" size={16}/></button>
                                </div>
                                
                                <div className="flex gap-2 mb-4">
                                    <input type="text" className="flex-1 h-10 px-3.5 rounded-xl bg-slate-50 border border-slate-200 outline-none text-xs font-semibold" placeholder="ชื่อหมวดหมู่ใหม่..." value={newCategoryInput} onChange={(e) => setNewCategoryInput(e.target.value)} />
                                    <button onClick={handleAddCategory} className="w-10 h-10 bg-indigo-600 rounded-xl text-white flex items-center justify-center hover:bg-indigo-700 active:scale-95 transition-all"><LucideIcon name="plus" size={16} /></button>
                                </div>

                                <div className="flex-1 overflow-y-auto no-scrollbar space-y-2 pr-1">
                                    {tempCategories.map((cat, i) => (
                                        <div key={i} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200/40">
                                            {editingCatIndex === i ? (
                                                <div className="flex w-full gap-1.5">
                                                    <input type="text" autoFocus className="flex-1 bg-white border border-slate-300 rounded-lg px-2.5 py-1 text-xs outline-none focus:border-indigo-500 font-semibold" value={editCatText} onChange={(e) => setEditCatText(e.target.value)} />
                                                    <button onClick={saveEditCategory} className="p-1.5 bg-indigo-600 text-white rounded-lg"><LucideIcon name="check" size={12}/></button>
                                                    <button onClick={() => setEditingCatIndex(null)} className="p-1.5 bg-slate-200 text-slate-600 rounded-lg"><LucideIcon name="x" size={12}/></button>
                                                </div>
                                            ) : (
                                                <>
                                                    <span className="text-xs font-medium text-slate-700">{cat}</span>
                                                    <div className="flex gap-2">
                                                         <button onClick={() => startEditCategory(i, cat)} className="text-slate-400 hover:text-slate-700 transition-colors"><LucideIcon name="pencil" size={14} /></button>
                                                         <button onClick={() => handleDeleteCategory(cat)} className="text-slate-400 hover:text-red-600 transition-colors"><LucideIcon name="trash-2" size={14} /></button>
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                
                                <button onClick={handleSaveCategories} className="w-full py-3.5 mt-5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs tracking-widest uppercase transition-colors">บันทึกการเปลี่ยนแปลงทั้งหมด</button>
                             </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
