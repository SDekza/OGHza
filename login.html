<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Enterprise Portal - SEBOFFICIAL</title>
    
    <link rel="icon" type="image/png" href="sebo.png">
    <link rel="apple-touch-icon" href="sebo.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Stable UMD React, ReactDOM, Babel Standalone & UI Libraries -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Explicitly load the UMD bundle of Lucide to prevent ESM module syntax errors -->
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');
        
        * {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        body { 
            font-family: 'Anuphan', sans-serif; 
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
            user-select: none; 
            overscroll-behavior-y: contain;
            min-height: 100vh;
            touch-action: manipulation;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes modal-pop { 
            0% { transform: scale(0.98); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }
        .animate-modal { animation: modal-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes shake { 
            10%, 90% { transform: translate3d(-1px, 0, 0); } 
            20%, 80% { transform: translate3d(1px, 0, 0); } 
            30%, 50%, 70% { transform: translate3d(-2px, 0, 0); } 
            40%, 60% { transform: translate3d(2px, 0, 0); } 
        }
        .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        .pin-dot { transition: all 0.2s; }
        .pin-dot.filled { background-color: #6366f1; transform: scale(1.1); border-color: #6366f1; }
        .pin-dot.empty { background-color: transparent; border: 2px solid #475569; }

        /* Fancy Background Glow */
        .glow-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(15,23,42,0) 70%);
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .app-card:hover {
            transform: translateY(-5px);
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.3);
        }
        
        .app-icon-wrap {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
        }
        
        .app-icon-wrap.stock {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useRef, memo } = React;

        const LucideIcon = memo(({ name, size = 20, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                let active = true;
                if (window.lucide && ref.current) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    ref.current.appendChild(i);
                    const timer = setTimeout(() => {
                        if (active && ref.current) {
                            window.lucide.createIcons({
                                root: ref.current,
                                nameAttr: 'data-lucide',
                                attrs: { width: size, height: size, class: "lucide-icon-svg" }
                            });
                        }
                    }, 0);
                    return () => { active = false; clearTimeout(timer); };
                }
            }, [name, size]);
            return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size, minWidth: size }} />;
        });

        // ==========================================
        // CONFIGURATION (Using existing Google Sheet)
        // ==========================================
        const SHEET_ID = "108d2PHlbqt5h6p6_O-6qRfGHqs2MNK6GBRjVYdpxAZM";
        const SETTINGS_GID = "1966833161"; 
        
        const getAvatarColor = (idx) => {
            const colors = ['bg-indigo-500', 'bg-emerald-600', 'bg-sky-600', 'bg-violet-600', 'bg-rose-500', 'bg-amber-600'];
            return colors[idx % colors.length];
        };

        const parseCSV = (text) => {
            if (!text) return [];
            const result = [];
            const lines = text.split(/\r?\n/);
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const row = [];
                let cur = '';
                let inQuote = false;
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') inQuote = !inQuote;
                    else if (char === ',' && !inQuote) { row.push(cur.trim()); cur = ''; }
                    else cur += char;
                }
                row.push(cur.trim());
                result.push(row);
            }
            return result;
        };

        const Portal = () => {
            const [usersData, setUsersData] = useState([]); 
            const [loading, setLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState(null);
            
            const [currentUser, setCurrentUser] = useState(null); 
            const [currentUserRank, setCurrentUserRank] = useState('Guest'); 
            
            const [modalStep, setModalStep] = useState('select'); 
            const [selectedTempUser, setSelectedTempUser] = useState(null);
            const [passwordInput, setPasswordInput] = useState('');
            const [passError, setPassError] = useState(false);

            // Prevent Pinch-to-Zoom globally
            useEffect(() => {
                const preventMultiTouch = (e) => {
                    if (e.touches && e.touches.length > 1) {
                        e.preventDefault();
                    }
                };

                const preventGesture = (e) => {
                    e.preventDefault();
                };

                // Prevent multi-touch zoom on mobile
                document.addEventListener('touchstart', preventMultiTouch, { passive: false });
                document.addEventListener('touchmove', preventMultiTouch, { passive: false });

                // Prevent Safari gestures
                document.addEventListener('gesturestart', preventGesture, { passive: false });
                document.addEventListener('gesturechange', preventGesture, { passive: false });
                document.addEventListener('gestureend', preventGesture, { passive: false });

                return () => {
                    document.removeEventListener('touchstart', preventMultiTouch);
                    document.removeEventListener('touchmove', preventMultiTouch);
                    document.removeEventListener('gesturestart', preventGesture);
                    document.removeEventListener('gesturechange', preventGesture);
                    document.removeEventListener('gestureend', preventGesture);
                };
            }, []);

            const fetchUsers = async () => {
                setLoading(true);
                setErrorMsg(null);
                const u = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SETTINGS_GID}&ts=${Date.now()}`;
                try { 
                    let text = "";
                    try {
                        const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(u)}`);
                        if (!response.ok) throw new Error("Proxy fetch failed");
                        text = await response.text();
                    } catch(e) {
                        const responseDirect = await fetch(u);
                        if (!responseDirect.ok) throw new Error("Direct fetch failed");
                        text = await responseDirect.text();
                    }

                    if (!text) throw new Error("ไม่สามารถโหลดข้อมูลผู้ใช้ได้");

                    const usrs = [];
                    const settingsRows = parseCSV(text);
                    settingsRows.slice(1).forEach(row => {
                        if (row[1]) usrs.push({ name: row[1].trim(), pass: (row[2] || "").trim(), rank: (row[3] || "User").trim() });
                    });
                    setUsersData(usrs);
                } catch(e) {
                    setErrorMsg("ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณาลองใหม่");
                } finally { 
                    setLoading(false); 
                }
            };

            useEffect(() => { 
                fetchUsers();
                const u = localStorage.getItem('seb_current_user');
                if (u) { 
                    setCurrentUser(u); 
                    setCurrentUserRank(localStorage.getItem('seb_current_rank') || 'User'); 
                }
            }, []);

            const handleUserSelect = (userObj) => {
                if (userObj.rank === 'Guest' || userObj.pass === 'guest') {
                    loginSuccess(userObj.name, 'Guest');
                    return;
                }
                const passLower = String(userObj.pass || "").toLowerCase().trim();
                if (passLower === "" || passLower === "none") {
                    loginSuccess(userObj.name, userObj.rank);
                } else {
                    setSelectedTempUser(userObj);
                    setModalStep('password');
                    setPasswordInput('');
                    setPassError(false);
                }
            };

            const loginSuccess = (name, rank) => {
                setCurrentUser(name);
                setCurrentUserRank(rank);
                localStorage.setItem('seb_current_user', name);
                localStorage.setItem('seb_current_rank', rank);
            };

            const handleLogout = () => {
                localStorage.removeItem('seb_current_user');
                localStorage.removeItem('seb_current_rank');
                setCurrentUser(null);
                setCurrentUserRank('Guest');
                setModalStep('select');
            };

            const handleNumInput = (num) => {
                if (modalStep === 'password' && passwordInput.length < 4) {
                    const newVal = passwordInput + num;
                    setPasswordInput(newVal);
                    if (newVal.length === 4) {
                        if (newVal === String(selectedTempUser.pass)) {
                            loginSuccess(selectedTempUser.name, selectedTempUser.rank);
                            setModalStep('select');
                            setSelectedTempUser(null);
                        } else {
                            setPassError(true);
                            setTimeout(() => { setPassError(false); setPasswordInput(''); }, 500);
                        }
                    }
                }
            };

            const handleNumDelete = () => {
                if (modalStep === 'password') setPasswordInput(prev => prev.slice(0, -1));
            };

            const renderPinDots = (value, length = 4) => (
                <div className="flex gap-4 justify-center mb-6">
                    {[...Array(length)].map((_, i) => (
                        <div key={i} className={`w-3.5 h-3.5 rounded-full border transition-all duration-200 ${i < value.length ? 'pin-dot filled' : 'pin-dot empty'}`}></div>
                    ))}
                </div>
            );

            if (currentUser) {
                return (
                    <div className="relative z-10 flex flex-col items-center justify-center min-h-screen p-6 animate-modal">
                        <div className="glow-bg"></div>
                        
                        <div className="w-full max-w-4xl relative z-10">
                            {/* Header */}
                            <div className="flex items-center justify-between mb-12">
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 rounded-2xl overflow-hidden border border-slate-700 shadow-lg">
                                        <img src="sebo.png" className="w-full h-full object-cover" onError={(e) => {e.target.style.display='none'}} alt="Logo" />
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold tracking-widest uppercase">SEBOFFICIAL</h1>
                                        <p className="text-xs text-indigo-400 font-semibold tracking-widest uppercase mt-1">Enterprise Portal</p>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-4">
                                    <div className="text-right hidden sm:block">
                                        <p className="text-sm font-semibold text-white">{currentUser}</p>
                                        <p className="text-[10px] text-slate-400 tracking-widest uppercase">{currentUserRank} Access</p>
                                    </div>
                                    <button onClick={handleLogout} className="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700 transition-colors">
                                        <LucideIcon name="log-out" size={16} />
                                    </button>
                                </div>
                            </div>

                            <h2 className="text-center text-slate-400 text-sm font-semibold tracking-[0.2em] uppercase mb-8">เลือกแอปพลิเคชันที่ต้องการใช้งาน</h2>

                            {/* App Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto">
                                
                                {/* App 1: SEBO Work Management */}
                                <a href="sebo.html" className="app-card rounded-3xl p-6 flex items-start gap-5 group cursor-pointer">
                                    <div className="w-16 h-16 rounded-2xl app-icon-wrap flex items-center justify-center shadow-lg shrink-0 group-hover:scale-105 transition-transform">
                                        <LucideIcon name="layout-dashboard" size={28} className="text-white" />
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-white mb-2 tracking-wide group-hover:text-indigo-400 transition-colors">ระบบสั่งงาน<br/><span className="text-xs font-normal opacity-80">(Work Management)</span></h3>
                                        <p className="text-xs text-slate-400 leading-relaxed font-medium">บันทึกคิวงาน, แจกจ่ายงาน, และดูสถิติผลการปฏิบัติงานรายวัน</p>
                                    </div>
                                    <div className="ml-auto mt-2 text-slate-500 group-hover:text-white transition-colors">
                                        <LucideIcon name="chevron-right" size={24} />
                                    </div>
                                </a>

                                {/* App 2: Stock & Inventory */}
                                <a href="stockspare.html" className="app-card rounded-3xl p-6 flex items-start gap-5 group cursor-pointer">
                                    <div className="w-16 h-16 rounded-2xl app-icon-wrap stock flex items-center justify-center shadow-lg shrink-0 group-hover:scale-105 transition-transform">
                                        <LucideIcon name="package-search" size={28} className="text-white" />
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-white mb-2 tracking-wide group-hover:text-emerald-400 transition-colors">ระบบคลังอะไหล่<br/><span className="text-xs font-normal opacity-80">(Stock Spare)</span></h3>
                                        <p className="text-xs text-slate-400 leading-relaxed font-medium">จัดการรายการอะไหล่, เบิก-จ่าย, ค้นหาตำแหน่งจัดเก็บ และส่งออกข้อมูล</p>
                                    </div>
                                    <div className="ml-auto mt-2 text-slate-500 group-hover:text-white transition-colors">
                                        <LucideIcon name="chevron-right" size={24} />
                                    </div>
                                </a>

                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="relative z-10 flex flex-col items-center justify-center min-h-screen p-6 text-center">
                    <div className="glow-bg"></div>
                    
                    <div className="max-w-6xl w-full relative z-10">
                        
                        <div className="mb-12">
                            <div className="w-16 h-16 rounded-2xl overflow-hidden border border-slate-700 shadow-2xl mx-auto mb-6">
                                <img src="sebo.png" className="w-full h-full object-cover" onError={(e) => {e.target.style.display='none'}} />
                            </div>
                            <h1 className="text-2xl font-bold tracking-widest uppercase mb-2">SEBOFFICIAL</h1>
                            <p className="text-xs text-indigo-400 font-semibold tracking-[0.2em] uppercase">Enterprise Portal</p>
                        </div>

                        {loading ? (
                            <div className="flex flex-col items-center gap-4 mt-12">
                                <div className="w-10 h-10 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
                                <p className="animate-pulse text-xs tracking-widest uppercase text-slate-400 font-medium">กำลังโหลดข้อมูลพนักงาน...</p>
                            </div>
                        ) : errorMsg ? (
                            <div className="space-y-6 max-w-sm mx-auto bg-slate-800/50 p-8 rounded-3xl border border-slate-700/50">
                                <LucideIcon name="alert-circle" size={48} className="text-red-400 mx-auto" />
                                <h3 className="text-lg font-medium tracking-wide">เชื่อมต่อไม่สำเร็จ</h3>
                                <p className="text-xs text-slate-400 leading-relaxed">{errorMsg}</p>
                                <button onClick={fetchUsers} className="w-full py-3.5 bg-indigo-600 text-white text-xs font-bold tracking-widest uppercase rounded-xl hover:bg-indigo-700 transition-all">ลองใหม่อีกครั้ง</button>
                            </div>
                        ) : (
                            modalStep === 'select' ? (
                                <div className="animate-modal">
                                    <h2 className="text-slate-400 text-sm font-semibold tracking-[0.2em] uppercase mb-10">เลือกผู้ใช้งานเข้าสู่ระบบ</h2>
                                    <div className="flex flex-wrap justify-center gap-6 max-w-4xl mx-auto">
                                        {usersData.length > 0 ? usersData.map((u, idx) => (
                                            <div key={idx} onClick={() => handleUserSelect(u)} className="group flex flex-col items-center gap-4 cursor-pointer transition-all active:scale-95">
                                                <div className={`w-20 h-20 rounded-3xl flex items-center justify-center text-white text-3xl font-light border border-slate-700 group-hover:border-indigo-400 transition-all transform group-hover:-translate-y-2 group-hover:shadow-[0_10px_30px_-10px_rgba(99,102,241,0.5)] ${getAvatarColor(idx)} shadow-lg`}>
                                                    {u.name.charAt(0).toUpperCase()}
                                                </div>
                                                <span className="text-slate-400 group-hover:text-white font-medium text-xs tracking-widest uppercase transition-colors">{u.name}</span>
                                            </div>
                                        )) : (
                                            <div className="text-slate-500 text-xs uppercase tracking-widest bg-slate-800/50 py-8 px-12 rounded-3xl border border-slate-700/50">ไม่พบรายชื่อผู้ใช้งานในระบบ</div>
                                        )}
                                    </div>
                                </div>
                            ) : (
                                <div className="max-w-sm mx-auto bg-slate-800/60 p-8 rounded-[2rem] border border-slate-700/50 backdrop-blur-xl animate-modal shadow-2xl">
                                    <div className="w-16 h-16 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-2xl font-light mx-auto mb-6 shadow-lg border border-indigo-500">
                                        {selectedTempUser?.name.charAt(0).toUpperCase()}
                                    </div>
                                    <h3 className="text-white text-lg font-bold tracking-wide mb-8">{selectedTempUser?.name}</h3>
                                    
                                    <div className={`transition-all duration-300 ${passError ? 'animate-shake' : ''}`}>
                                        {renderPinDots(passwordInput)}
                                    </div>
                                    
                                    {passError && <p className="text-red-400 text-xs tracking-wider mb-4 font-medium">รหัสผ่านไม่ถูกต้อง</p>}

                                    <div className="grid grid-cols-3 gap-4 mt-8 max-w-[240px] mx-auto">
                                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                                            <button key={num} onClick={() => handleNumInput(String(num))} className="w-14 h-14 rounded-full bg-slate-700 text-white text-xl font-light hover:bg-indigo-600 active:scale-95 transition-all">{num}</button>
                                        ))}
                                        <div className="w-14 h-14"></div>
                                        <button onClick={() => handleNumInput('0')} className="w-14 h-14 rounded-full bg-slate-700 text-white text-xl font-light hover:bg-indigo-600 active:scale-95 transition-all">0</button>
                                        <button onClick={handleNumDelete} className="w-14 h-14 rounded-full bg-slate-800/50 border border-slate-700 text-slate-400 hover:text-white hover:bg-slate-700 active:scale-95 transition-all flex items-center justify-center"><LucideIcon name="delete" size={18}/></button>
                                    </div>

                                    <div className="mt-10 pt-6 border-t border-slate-700/50">
                                        <button onClick={() => setModalStep('select')} className="text-slate-400 hover:text-white tracking-widest text-[10px] uppercase font-bold flex items-center justify-center gap-2 mx-auto transition-colors">
                                            <LucideIcon name="arrow-left" size={14} /> กลับไปเลือกบัญชีอื่น
                                        </button>
                                    </div>
                                </div>
                            )
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Portal />);
    </script>
</body>
</html>
