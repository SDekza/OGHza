                      const key = item.timestamp + item.productName;
                      const isGuest = currentUserRank === 'Guest';
                      const isMyWork = item.doingBy === currentUser;
                      const isLocked = item.isDoing && !isMyWork;
                      const isCustomItem = !item.imageUrl;

                      return (
                        <div 
                          key={idx} 
                          className={`relative bg-white rounded-3xl p-4 shadow-md border-2 transition-all duration-300 flex items-start gap-3 ${
                            item.isUrgent ? 'border-red-400 bg-red-50/10 shadow-lg' : 'border-slate-100'
                          }`}
                        >
                          {/* Checked Trigger checkbox */}
                          <button 
                            onClick={() => !isGuest && handleCheckboxClick(item)}
                            disabled={isGuest || isLocked}
                            className={`absolute -left-3 -top-3 z-10 w-10 h-10 rounded-full flex items-center justify-center border-2 transition-all shadow-md ${
                              item.isDone ? 'bg-emerald-600 border-emerald-500 text-white' : 
                              item.isDoing ? 'bg-amber-500 border-amber-400 text-white' : 'bg-white border-slate-200 text-slate-300'
                            } ${isGuest || isLocked ? 'cursor-not-allowed opacity-50' : 'active:scale-90'}`}
                          >
                            <LucideIcon name={item.isDone || item.isDoing ? "check" : "circle"} size={16} />
                          </button>

                          {/* Image preview thumbnail */}
                          <div className="w-16 h-16 rounded-2xl bg-slate-50 border border-slate-100 overflow-hidden shrink-0 flex items-center justify-center">
                            {!isCustomItem ? (
                              <img src={item.imageUrl} className="w-full h-full object-cover" onClick={() => setPreviewImage(item.imageUrl)} alt="" />
                            ) : (
                              <button 
                                onClick={() => copyToClipboard(item.productName)}
                                className="w-full h-full bg-indigo-50 text-indigo-600 text-[10px] font-black flex flex-col items-center justify-center gap-1 active:bg-indigo-100 transition-colors"
                              >
                                <LucideIcon name="copy" size={14} />
                                คัดลอกชื่อ
                              </button>
                            )}
                          </div>

                          {/* Detail fields */}
                          <div className="flex-1 space-y-0.5">
                            <div className="flex items-center gap-1.5 flex-wrap">
                              <span className="text-[10px] font-black text-indigo-600 uppercase tracking-wider">{item.type}</span>
                              {item.isStock && <span className="text-[8px] bg-blue-100 text-blue-700 font-black px-1.5 py-0.5 rounded-full">STOCK</span>}
                              {item.isUrgent && <span className="text-[8px] bg-red-100 text-red-700 font-black px-1.5 py-0.5 rounded-full">ด่วนพิเศษ</span>}
                            </div>
                            <h4 className="font-bold text-slate-800 text-xs sm:text-sm line-clamp-1">{item.productName}</h4>
                            <span className="text-[9px] text-slate-400 block font-mono">{item.timestamp}</span>
                            
                            {/* Worker assigned names */}
                            {item.isDoing && !item.isDone && (
                              <p className="text-[9px] font-bold text-amber-600 flex items-center gap-1">
                                <span className="inline-block w-1.5 h-1.5 bg-amber-500 rounded-full animate-ping" />
                                ⚡ กำลังทำโดย: {item.doingBy}
                              </p>
                            )}
                            {item.isDone && item.doneBy && (
                              <p className="text-[9px] font-bold text-emerald-600 flex items-center gap-1">
                                ✅ เสร็จโดย: {item.doneBy}
                              </p>
                            )}

                            {item.memo && (
                              <p className={`text-[10px] italic mt-1 font-bold ${
                                isCustomItem ? 'text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md inline-block' : 'text-slate-400 truncate'
                              }`}>
                                {isCustomItem ? '📝 ' : 'บันทึก: '}{item.memo}
                              </p>
                            )}
                          </div>

                          {/* Quantities indicators */}
                          <div className="flex flex-col items-end gap-2 shrink-0">
                            <div className="text-right">
                              <span className="text-[9px] text-slate-400 font-bold block">จำนวน</span>
                              <span 
                                onClick={() => {
                                  if (!isGuest && !isLocked) {
                                    setEditTaskItem(item);
                                    setEditTaskForm({ quantity: item.quantity, memo: item.memo || '', isUrgent: item.isUrgent || false });
                                  }
                                }}
                                className={`text-3xl font-black text-slate-900 leading-none font-mono ${
                                  !isGuest && !isLocked ? 'cursor-pointer hover:text-indigo-600 transition-colors' : ''
                                }`}
                              >
                                {item.quantity}
                              </span>
                            </div>
                            
                            {/* Admin actions buttons */}
                            {!isGuest && !isLocked && (
                              <div className="flex gap-1">
                                <button 
                                  onClick={() => {
                                    setEditTaskItem(item);
                                    setEditTaskForm({ quantity: item.quantity, memo: item.memo || '', isUrgent: item.isUrgent || false });
                                  }}
                                  className="p-2 text-slate-300 hover:text-amber-500 active:scale-75 transition-all bg-white/50 rounded-full shadow-sm md:shadow-none md:bg-transparent"
                                >
                                  <LucideIcon name="edit" size={12} />
                                </button>
                                <button 
                                  onClick={() => setItemToDelete(item)}
                                  className="p-2 text-slate-300 hover:text-red-600 active:scale-75 transition-all bg-white/50 rounded-full shadow-sm md:shadow-none md:bg-transparent"
                                >
                                  <LucideIcon name="trash" size={12} />
                                </button>
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })
                  ) : (
                    <div className="bg-white rounded-3xl p-10 text-center text-xs font-bold text-slate-400 border border-slate-100">
                      <LucideIcon name="info" className="mx-auto mb-2 text-slate-300" size={24} />
                      ไม่มีรายการงานคงเหลือในระบบคิวขณะนี้
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 3: ANALYSIS / PERFORMANCE METRICS REPORTS */}
            {activeTab === 'analysis' && (
              <div className="bg-white rounded-3xl p-5 shadow-xl border border-slate-100 space-y-5 animate-modal">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                  <h2 className="text-base font-black text-slate-900 flex items-center gap-2">
                    <LucideIcon name="bar-chart-2" className="text-indigo-600" size={18} />
                    สถิติและรายงานผลงาน
                  </h2>
                  <select 
                    className="bg-slate-100 border-none rounded-xl px-4 py-2 text-sm font-bold outline-none text-slate-700 font-bold"
                    value={analysisRange} 
                    onChange={(e) => setAnalysisRange(e.target.value)}
                  >
                    <option value="today">วันนี้</option>
                    <option value="yesterday">เมื่อวานนี้</option>
                    <option value="7d">ย้อนหลัง 7 วัน</option>
                    <option value="30d">ย้อนหลัง 30 วัน</option>
                  </select>
                </div>

                {/* Scorecards */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-indigo-50/50 rounded-2xl p-4 border border-indigo-100/50">
                    <span className="text-[10px] font-black text-indigo-600 uppercase tracking-widest block mb-1">จำนวนชิ้นงานรวม</span>
                    <span className="text-3xl font-black text-slate-950 font-mono block leading-none">{analysisData.totalQty}</span>
                    <span className="text-[9px] font-bold text-slate-400">จากทั้งหมด {analysisData.totalRecords} รายการคิว</span>
                  </div>
                  <div className="bg-emerald-50/50 rounded-2xl p-4 border border-emerald-100/50">
                    <span className="text-[10px] font-black text-emerald-600 uppercase tracking-widest block mb-1">ความเร็วปฏิบัติการ</span>
                    <span className="text-3xl font-black text-slate-950 block leading-none">เสถียร</span>
                    <span className="text-[9px] font-bold text-slate-400">อัปเดตระบบเรียลไทม์</span>
                  </div>
                </div>

                {/* Top Products Volume list */}
                <div className="space-y-2">
                  <span className="text-xs font-black text-slate-500 uppercase tracking-widest block mb-1">
                    สินค้าที่สั่งทำบ่อยที่สุด (Top 5)
                  </span>
                  <div className="space-y-2">
                    {analysisData.topProducts.map((p, i) => {
                      const isTop = i === 0;
                      const isSecond = i === 1;
                      const isThird = i === 2;
                      let bgClass = "bg-slate-50 border-slate-100";
                      let rankBadge = <span>{i + 1}</span>;
                      let textClass = "text-slate-700";
                      let qtyClass = "text-indigo-600";
                      let imgBorder = "border-slate-200";
                      
                      if (isTop) {
                        bgClass = "bg-gradient-to-r from-yellow-50 via-amber-100 to-yellow-50 border-yellow-300 shadow-md shadow-yellow-200/50 transform scale-[1.02] z-10 relative overflow-hidden";
                        rankBadge = (
                          <span className="text-amber-500 font-bold flex items-center gap-1">1 🥇</span>
                        );
                        textClass = "text-amber-800";
                        qtyClass = "text-amber-600 text-2xl";
                        imgBorder = "border-yellow-400";
                      } else if (isSecond) {
                        bgClass = "bg-gradient-to-r from-slate-50 to-slate-200 border-slate-300 shadow-sm relative";
                        rankBadge = <span>2 🥈</span>;
                        textClass = "text-slate-800";
                        qtyClass = "text-slate-600";
                        imgBorder = "border-slate-400";
                      } else if (isThird) {
                        bgClass = "bg-gradient-to-r from-orange-50 to-orange-100 border-orange-200 shadow-sm relative";
                        rankBadge = <span>3 🥉</span>;
                        textClass = "text-orange-900";
                        qtyClass = "text-orange-700";
                        imgBorder = "border-orange-400";
                      }

                      return (
                        <div 
                          key={i} 
                          className={`flex items-center justify-between p-3 rounded-2xl border ${bgClass}`}
                        >
                          <div className="flex items-center gap-2">
                            <span className="font-black text-xs min-w-[24px] text-center">{rankBadge}</span>
                            {p.image ? (
                              <img src={p.image} className={`w-8 h-8 object-cover rounded-md border ${imgBorder}`} alt="" />
                            ) : (
                              <div className="w-8 h-8 bg-slate-100 text-slate-400 rounded-md flex items-center justify-center"><LucideIcon name="image" size={12} /></div>
                            )}
                            <div>
                              <span className={`text-xs font-bold block ${textClass} line-clamp-1`}>{p.name}</span>
                              {isTop && <span className="text-[8px] bg-amber-500 text-white font-black px-1.5 py-0.5 rounded-full inline-block mt-0.5">Bestseller 🌟</span>}
                            </div>
                          </div>
                          <span className={`font-black font-mono ${qtyClass}`}>{p.qty} ชิ้น</span>
                        </div>
                      );
                    })}
                    {analysisData.topProducts.length === 0 && (
                      <div className="text-center py-6 text-slate-400 text-xs font-bold">ไม่มีข้อมูลสถิติสินค้าในช่วงเวลานี้</div>
                    )}
                  </div>
                </div>

                {/* Workers Performance Board */}
                <div className="space-y-2">
                  <span className="text-xs font-black text-slate-500 uppercase tracking-widest block mb-1">
                    อันดับผลงานสมาชิก (จัดทำสำเร็จ)
                  </span>
                  <div className="space-y-2">
                    {analysisData.topUsers.length > 0 ? analysisData.topUsers.map(([user, qty], i) => {
                      const isTop = i === 0;
                      const isSecond = i === 1;
                      const isThird = i === 2;
                      let bgClass = "bg-slate-50 border-slate-100";
                      let rankElement = <span>{i + 1}</span>;
                      let textClass = "text-slate-600";
                      
                      if (isTop) {
                        bgClass = "bg-gradient-to-r from-yellow-50 via-amber-100 to-yellow-50 border-yellow-300 shadow-md shadow-yellow-200/50 transform scale-[1.02] z-10 relative overflow-hidden";
                        rankElement = (
                          <span className="text-amber-500 font-bold">1 🏆</span>
                        );
                        textClass = "text-amber-700";
                      } else if (isSecond) {
                        bgClass = "bg-gradient-to-r from-slate-50 to-slate-200 border-slate-300 shadow-sm";
                        rankElement = <span>2 🥈</span>;
                        textClass = "text-slate-700";
                      } else if (isThird) {
                        bgClass = "bg-gradient-to-r from-orange-50 to-orange-100 border-orange-200 shadow-sm";
                        rankElement = <span>3 🥉</span>;
                        textClass = "text-orange-800";
                      }

                      return (
                        <div 
                          key={i} 
                          className={`flex items-center justify-between p-3 rounded-2xl border ${bgClass}`}
                        >
                          <div className="flex items-center gap-2">
                            <span className="font-black text-xs min-w-[20px] text-center">{rankElement}</span>
                            <div>
                              <span className={`text-xs font-black ${textClass}`}>{user}</span>
                              {isTop && <span className="text-[8px] bg-amber-500 text-white font-black px-1.5 py-0.5 rounded-full inline-block ml-1.5 leading-none">Top Performer 🏆</span>}
                            </div>
                          </div>
                          <span className="font-black font-mono text-sm text-slate-700">{qty} ชิ้น</span>
                        </div>
                      );
                    }) : (
                      <div className="text-center py-6 text-slate-400 text-xs font-bold">ยังไม่มีข้อมูลผลงาน</div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: SYSTEM MASTER DATA MANAGEMENT */}
            {activeTab === 'manage' && (
              <div className="bg-white rounded-3xl p-5 shadow-xl border border-slate-100 space-y-4 animate-modal">
                <div className="flex gap-2 p-1 bg-slate-50 rounded-2xl">
                  <button 
                    onClick={() => setManageSubTab('search')}
                    className={`flex-1 py-2.5 rounded-xl font-bold text-xs transition-all ${
                      manageSubTab === 'search' ? 'bg-indigo-100 text-indigo-700 shadow-sm' : 'text-slate-400 hover:bg-slate-50'
                    }`}
                  >
                    รายการสินค้า
                  </button>
                  {(currentUserRank === 'Admin' || currentUserRank === 'Dev') && (
                    <>
                      <button 
                        onClick={() => setManageSubTab('add')}
                        className={`flex-1 py-2.5 rounded-xl font-bold text-xs transition-all ${
                          manageSubTab === 'add' ? 'bg-emerald-100 text-emerald-700 shadow-sm' : 'text-slate-400 hover:bg-slate-50'
                        }`}
                      >
                        เพิ่มใหม่
                      </button>
                      <button 
                        onClick={() => { setEditCategoriesMode(true); setTempCategories(categories); }}
                        className="flex-1 py-2.5 rounded-xl font-bold text-xs transition-all text-slate-400 hover:bg-amber-50 hover:text-amber-600"
                      >
                        หมวดหมู่
                      </button>
                    </>
                  )}
                </div>

                {/* Sub Tab: Search master inventory list */}
                {manageSubTab === 'search' && (
                  <div className="space-y-4">
                    <div className="relative">
                      <input 
                        type="text" 
                        placeholder="ค้นชื่อสินค้าคงคลัง..." 
                        className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-4 text-xs font-bold outline-none focus:border-indigo-500"
                        value={productSearchInput}
                        onChange={(e) => setProductSearchInput(e.target.value)}
                      />
                      {productSearchInput && (
                        <button onClick={() => setProductSearchInput('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500">
                          <LucideIcon name="x-circle" size={16} />
                        </button>
                      )}
                    </div>

                    <div className="space-y-2 max-h-[400px] overflow-y-auto no-scrollbar">
                      {masterProducts.filter(p => p.name.toLowerCase().includes(productSearchInput.toLowerCase())).length > 0 ? (
                        masterProducts
                          .filter(p => p.name.toLowerCase().includes(productSearchInput.toLowerCase()))
                          .map((p, idx) => (
                            <div key={idx} className="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border border-slate-100">
                              <div className="flex items-center gap-2">
                                {p.imgUrl ? (
                                  <img src={p.imgUrl} className="w-10 h-10 object-cover rounded-xl border" alt="" />
                                ) : (
                                  <div className="w-10 h-10 bg-slate-200 rounded-xl flex items-center justify-center text-slate-400"><LucideIcon name="image" size={14} /></div>
                                )}
                                <span className="text-xs font-bold text-slate-700 line-clamp-1">{p.name}</span>
                              </div>
                              
                              <div className="flex gap-1.5">
                                <button 
                                  onClick={() => setPreviewImage(p.imgUrl)} 
                                  disabled={!p.imgUrl}
                                  className="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 hover:bg-emerald-100 disabled:opacity-40 flex items-center justify-center transition-all"
                                >
                                  <LucideIcon name="eye" size={14} />
                                </button>
                                {(currentUserRank === 'Admin' || currentUserRank === 'Dev') && (
                                  <>
                                    <button 
                                      onClick={() => setEditMasterItem({ originalName: p.name, name: p.name, imgUrl: p.imgUrl })}
                                      className="w-8 h-8 rounded-full bg-amber-50 text-amber-600 hover:bg-amber-100 flex items-center justify-center transition-all"
                                    >
                                      <LucideIcon name="edit-2" size={14} />
                                    </button>
                                    <button 
                                      onClick={() => setMasterItemToDelete(p.name)}
                                      className="w-8 h-8 rounded-full bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center transition-all"
                                    >
                                      <LucideIcon name="trash" size={14} />
                                    </button>
                                  </>
                                )}
                              </div>
                            </div>
                          ))
                      ) : (
                        <div className="text-center py-10 text-xs font-bold text-slate-400">ไม่พบข้อมูลสินค้าที่ระบุ</div>
                      )}
                    </div>
                  </div>
                )}

                {/* Sub Tab: Add new Master inventory items */}
                {manageSubTab === 'add' && (currentUserRank === 'Admin' || currentUserRank === 'Dev') && (
                  <div className="space-y-4 animate-modal">
                    <div className="space-y-1">
                      <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">ชื่อสินค้าที่ต้องการเพิ่ม</label>
                      <input 
                        type="text" 
                        placeholder="ชื่อสินค้า..." 
                        className="w-full h-14 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-2xl px-6 font-bold outline-none shadow-inner transition-all" 
                        value={newProduct.name} 
                        onChange={(e) => setNewProduct({...newProduct, name: e.target.value})} 
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest font-bold">อัปโหลดภาพสินค้า</label>
                      <div className="relative border-2 border-dashed border-slate-200 rounded-2xl p-6 hover:bg-slate-50/50 transition-all flex flex-col items-center justify-center gap-2">
                        <input 
                          type="file" 
                          accept="image/*" 
                          onChange={(e) => { 
                            const f = e.target.files[0]; 
                            if(f){
                              const r = new FileReader();
                              r.onloadend = () => setNewProduct(p => ({...p, imageBase64: r.result.split(',')[1], imageType: f.type, preview: r.result})); 
                              r.readAsDataURL(f);
                            }
                          }}
                          className="absolute inset-0 opacity-0 cursor-pointer z-10" 
                        />
                        <LucideIcon name="camera" className="text-slate-400" size={24} />
                        <span className="text-xs font-bold text-slate-500">เลือกไฟล์รูปภาพที่นี่...</span>
                      </div>
                    </div>

                    {newProduct.preview && (
                      <div className="flex justify-center">
                        <img src={newProduct.preview} className="max-w-[150px] max-h-[150px] object-contain rounded-2xl shadow-md border" alt="Preview upload" />
                      </div>
                    )}

                    <button 
                      onClick={handleAddProductMaster} 
                      disabled={!newProduct.name || !newProduct.imageBase64 || isEditingMaster} 
                      className="w-full h-14 bg-indigo-600 disabled:bg-slate-200 text-white rounded-2xl font-black text-lg shadow-xl active:scale-95 transition-all uppercase"
                    >
                      {isEditingMaster ? 'กำลังเพิ่มสินค้า...' : 'ยืนยันการเพิ่ม'}
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* TAB 5: DEVELOPER CONSOLE CONTROL */}
            {activeTab === 'dev' && currentUserRank === 'Dev' && (
              <div className="bg-white rounded-3xl p-5 shadow-xl border border-slate-100 space-y-5 animate-modal">
                <h2 className="text-base font-black text-slate-900 flex items-center gap-2 pb-2 border-b">
                  <LucideIcon name="terminal" className="text-red-500" size={18} />
                  ระบบวิศวกรผู้ดูแลระบบ (Dev Console)
                </h2>

                {/* Team Roster details */}
                <div className="space-y-3">
                  <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">บัญชีทีมงานทั้งหมด</span>
                  <div className="space-y-2 max-h-60 overflow-y-auto no-scrollbar">
                    {usersData.map((u, idx) => (
                      <div key={idx} className="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border text-xs">
                        <div>
                          <div className="flex items-center gap-1.5">
                            <h4 className="font-bold text-slate-800">{u.name}</h4>
                            <span className={`text-[8px] px-2 py-0.5 rounded-full font-black border uppercase tracking-tighter shadow-sm leading-none ${
                              u.rank === 'Dev' ? 'bg-red-100 text-red-600 border-red-200' : 
                              (u.rank === 'Admin' ? 'bg-indigo-100 text-indigo-600 border-indigo-200' : 'bg-white text-slate-400 border-slate-200')
                            }`}>
                              {u.rank}
                            </span>
                          </div>
                          <p className="text-[10px] text-slate-400 mt-0.5">
                            Pass: {visiblePasswords.has(u.name) ? (u.pass || 'ไม่มีรหัส') : '••••'}
                          </p>
                        </div>

                        <div className="flex gap-1.5 items-center">
                          <button 
                            onClick={() => setVisiblePasswords(prev => { 
                              const next = new Set(prev);
                              if (next.has(u.name)) next.delete(u.name); 
                              else next.add(u.name); 
                              return next;
                            })} 
                            className="text-emerald-500 hover:text-emerald-600 transition-colors p-1"
                          >
                            <LucideIcon name={visiblePasswords.has(u.name) ? "eye-off" : "eye"} size={14} />
                          </button>
                          <button 
                            onClick={() => setEditUserRankModal(u)} 
                            className="p-2.5 bg-white border border-slate-200 rounded-xl text-indigo-500 hover:bg-indigo-600 hover:text-white transition-all shadow-sm active:scale-90 shadow-indigo-100"
                          >
                            <LucideIcon name="award" size={14} />
                          </button>
                          <button 
                            onClick={() => { setEditUserPassModal(u); setNewPassValue(u.pass); }} 
                            className="p-2.5 bg-white border border-slate-200 rounded-xl text-amber-500 hover:bg-amber-600 hover:text-white transition-all shadow-sm active:scale-90 shadow-amber-100"
                          >
                            <LucideIcon name="lock" size={14} />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Operations triggers */}
                <div className="space-y-2">
                  <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">คำสั่งระดับสูง</span>
                  <div className="grid grid-cols-2 gap-3">
                    <button 
                      onClick={() => setDevActionModal('clear_records')}
                      className="p-3 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold rounded-2xl border border-red-200 flex items-center justify-center gap-1.5"
                    >
                      <LucideIcon name="trash" size={14} />
                      ล้างคิวงานทั้งหมด
                    </button>
                    <button 
                      onClick={() => setDevActionModal('clear_logs')}
                      className="p-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-2xl flex items-center justify-center gap-1.5"
                    >
                      <LucideIcon name="file-text" size={14} />
                      ล้างบันทึกการทำงาน
                    </button>
                  </div>
                </div>

                {/* Log list feed */}
                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">ประวัติบันทึกระบบ</span>
                    <button 
                      onClick={fetchLogs} 
                      className="text-[10px] text-indigo-600 font-bold flex items-center gap-1 hover:underline"
                    >
                      <LucideIcon name="refresh-cw" size={12} className={logsLoading ? "animate-spin" : ""} />
                      {logsLoading ? 'กำลังโหลด...' : 'รีเฟรชประวัติงาน'}
                    </button>
                  </div>

                  {showLogs ? (
                    <div className="bg-slate-900 text-emerald-400 font-mono text-[10px] p-4 rounded-2xl max-h-60 overflow-y-auto no-scrollbar space-y-2">
                      {logsData.map((log, i) => (
                        <div key={i} className="border-b border-slate-800 pb-1.5 last:border-0">
                          <span className="text-slate-500">[{log.timestamp}]</span> <span className="text-indigo-400 font-bold">{log.user}</span>: <span className="text-white">{log.action}</span> - {log.details}
                        </div>
                      ))}
                      {logsData.length === 0 && <p className="text-slate-500 text-center">ไม่มีบันทึกประวัติการทำงานในระบบ</p>}
                    </div>
                  ) : (
                    <p className="text-slate-400 text-xs text-center py-4 bg-slate-50 rounded-2xl">กรุณากดรีเฟรชเพื่อดึงบันทึกล่าสุด</p>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Footer details */}
          <footer className="text-center py-6 text-slate-400 space-y-1">
            <p className="text-[9px] font-black tracking-[0.2em] uppercase">SEBOFFICIAL V4.5.0 ENTERPRISE</p>
            <p className="text-[8px] font-bold">Google Cloud Sync | Active: {currentUser || 'ยังไม่ได้ระบุตัวตน'} ({currentUserRank})</p>
          </footer>

          {/* ======================================= */}
          {/* FLOATING WINDOWS / MODALS POPUPS WINDOW */}
          {/* ======================================= */}
          
          {/* Dev Confirmation Action Modal */}
          {devActionModal && (
            <div className="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 text-center space-y-4 animate-modal">
                <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto">
                  <LucideIcon name="alert-triangle" size={24} />
                </div>
                <div>
                  <h3 className="text-sm font-black text-slate-900 uppercase">ยืนยันการล้างข้อมูล?</h3>
                  <p className="text-[10px] text-slate-400 mt-1">กรุณากรอกรหัสผ่านหลักเพื่อยืนยันสิทธิ์ขั้นสูงสุด</p>
                </div>
                
                <input 
                  type="password" 
                  inputMode="numeric" 
                  pattern="[0-9]*" 
                  placeholder="Confirm Password" 
                  className={`w-full py-5 px-6 rounded-2xl border-2 text-center font-black text-4xl text-slate-700 outline-none mb-6 shadow-inner ${
                    passError ? 'border-red-500 animate-shake bg-red-50' : 'border-slate-100 bg-slate-50 focus:border-red-500'
                  }`} 
                  value={devPassInput} 
                  onChange={(e) => setDevPassInput(e.target.value)} 
                  onKeyDown={(e) => { if (e.key === 'Enter') confirmClearSheet(devActionModal); }} 
                />

                <div className="flex gap-2">
                  <button 
                    onClick={() => { setDevActionModal(null); setDevPassInput(''); }} 
                    className="flex-1 h-14 rounded-2xl text-slate-400 bg-slate-50 transition-colors active:scale-95 border-2 border-transparent font-black leading-none uppercase text-xs"
                  >
                    ยกเลิก
                  </button>
                  <button 
                    onClick={() => confirmClearSheet(devActionModal)} 
                    className="flex-1 h-14 rounded-2xl font-black bg-red-600 text-white shadow-lg active:scale-95 shadow-red-200 leading-none uppercase text-xs"
                  >
                    ยืนยัน
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* User Rank assignment modal */}
          {editUserRankModal && (
            <div className="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4 animate-modal">
                <h3 className="text-sm font-black text-slate-900 text-center uppercase tracking-wider leading-none">ปรับระดับสิทธิ์ตำแหน่ง</h3>
                <div className="space-y-2">
                  {['Dev', 'Admin', 'User', 'Guest'].map(r => (
                    <button 
                      key={r} 
                      onClick={() => handleUpdateUserSetting(editUserRankModal.name, r, editUserRankModal.pass)}
                      className={`w-full py-5 rounded-2xl border-2 font-black transition-all active:scale-95 shadow-sm leading-none ${
                        editUserRankModal.rank === r ? 'bg-indigo-600 border-indigo-600 text-white shadow-xl' : 'bg-slate-50 border-transparent text-slate-400 hover:bg-slate-100'
                      }`}
                    >
                      {r}
                    </button>
                  ))}
                </div> 
                <button 
                  onClick={() => setEditUserRankModal(null)} 
                  className="w-full py-3 mt-4 text-slate-400 font-bold hover:text-red-500 transition-colors uppercase text-[10px] tracking-[0.2em] leading-none font-black"
                >
                  Close Window
                </button>
              </div>
            </div>
          )}

          {editUserPassModal && (
            <div className="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-md flex items-center justify-center p-4">

                  autoFocus 
                  type="number"
                  inputMode="numeric" 
                  placeholder="0000" 
                  className="w-full py-6 rounded-2xl bg-slate-50 border-2 border-slate-100 focus:border-amber-500 text-center font-black text-5xl text-amber-600 outline-none shadow-inner leading-none"
                  value={newPassValue} 
                  onChange={(e) => setNewPassValue(e.target.value.slice(0, 4))} 
                />  
                <div className="flex gap-2">
                  <button 
                    onClick={() => setEditUserPassModal(null)} 
                    className="flex-1 h-14 rounded-2xl text-slate-400 bg-slate-50 active:scale-95 shadow-sm border border-transparent font-black leading-none uppercase text-xs"
                  >
                    ยกเลิก
                  </button> 
                  <button 
                    onClick={() => handleUpdateUserSetting(editUserPassModal.name, editUserPassModal.rank, newPassValue)} 
                    className="flex-1 h-14 rounded-2xl bg-amber-500 text-white shadow-lg active:scale-95 shadow-amber-100 font-black leading-none uppercase text-xs"
                  >
                    บันทึกรหัส
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Edit Queue Task details modal */}
          {editTaskItem && (
            <div className="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4 animate-modal">

                <h4 className="font-bold text-slate-800 text-sm text-center truncate">{editTaskItem.productName}</h4>
                
                <div className="space-y-1">
                  <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">จำนวนสินค้า</label>
                  <div className="flex h-11 items-center gap-2">
                    <button 
                      onClick={() => setEditTaskForm(p => ({...p, quantity: String(Math.max(1, parseInt(p.quantity) - 1))}))} 
                      className="w-12 h-full flex items-center justify-center rounded-xl bg-slate-100 text-slate-400 hover:text-amber-600 shadow-sm active:scale-90"
                    >
                      -
                    </button>
                    <input 
                      type="number" 
                      className="flex-1 w-full bg-transparent text-center font-black text-2xl text-amber-600 outline-none m-0 appearance-none"
                      value={editTaskForm.quantity} 
                      onChange={(e) => setEditTaskForm(p => ({...p, quantity: e.target.value}))} 
                    />
                    <button 
                      onClick={() => setEditTaskForm(p => ({...p, quantity: String(parseInt(p.quantity || 0) + 1)}))} 
                      className="w-12 h-full flex items-center justify-center rounded-xl bg-slate-100 text-slate-400 hover:text-amber-600 shadow-sm active:scale-90"
                    >
                      +
                    </button>
                  </div>
                </div>

                <div className="space-y-1">
                  <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">หมายเหตุ</label>
                  <input 
                    type="text" 
                    className="w-full h-14 bg-slate-50 border-2 border-transparent focus:border-amber-500 rounded-xl px-4 font-bold text-slate-700 outline-none shadow-sm transition-all" 
                    value={editTaskForm.memo}
                    onChange={(e) => setEditTaskForm(p => ({...p, memo: e.target.value}))}
                    placeholder="เพิ่มหมายเหตุ..." 
                  />
                </div>

                <button 
                  onClick={() => setEditTaskForm(p => ({...p, isUrgent: !p.isUrgent}))}
                  className={`w-full h-14 rounded-xl font-bold border-2 transition-all active:scale-95 flex items-center justify-center gap-2 ${
                    editTaskForm.isUrgent ? 'bg-red-50 border-red-500 text-red-600 shadow-sm animate-pulse' : 'bg-slate-50 border-slate-200 text-slate-400'
                  }`}
                >
                  {editTaskForm.isUrgent ? 'สถานะ: ด่วนพิเศษ 🔥' : 'สถานะ: ระดับปกติ'}
                </button>

                <div className="flex gap-2 pt-2">
                  <button 
                    onClick={() => setEditTaskItem(null)} 
                    className="flex-1 h-14 rounded-xl text-slate-400 bg-slate-100 font-black uppercase text-xs active:scale-95 transition-all"
                  >
                    ยกเลิก
                  </button>
                  <button 
                    onClick={confirmEditTask} 
                    className="flex-1 h-14 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-black uppercase text-xs active:scale-95 transition-all shadow-md"
                  >
                    บันทึก
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Delete confirmation modal */}
          {itemToDelete && (
            <div className="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 text-center space-y-4 animate-modal">
                <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto">
                  <LucideIcon name="trash" size={24} />
                </div>
                <div>
                  <h3 className="text-sm font-black text-slate-900">ลบรายการงานนี้?</h3>
                  <p className="text-[10px] text-slate-400 mt-1 truncate">งาน: {itemToDelete.productName}</p>
                </div>
                <div className="flex gap-2">
                  <button 
                    onClick={() => setItemToDelete(null)} 
                    className="flex-1 h-14 rounded-2xl font-bold text-slate-400 bg-slate-50 border-2 border-transparent active:scale-95 transition-all uppercase text-xs"
                  >
                    ยกเลิก
                  </button>
                  <button 
                    onClick={confirmDelete} 
                    className="flex-1 h-14 rounded-2xl font-black bg-red-600 text-white shadow-lg active:scale-95 transition-all uppercase text-xs"
                  >
                    ยืนยัน
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Delete Master product modal */}
          {masterItemToDelete && (
            <div className="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 text-center space-y-4 animate-modal">
                <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto">
                  <LucideIcon name="alert-triangle" size={24} />
                </div>
                <div>
                  <h3 className="text-sm font-black text-slate-900">ลบสินค้าออกจากคลัง?</h3>
                  <p className="text-[10px] text-slate-400 mt-1">สินค้านี้จะถูกลบออกจากฐานข้อมูลหลักทันที</p>
                </div>
                <div className="flex gap-2">
                  <button 
                    onClick={() => setMasterItemToDelete(null)} 
                    className="flex-1 h-14 rounded-2xl bg-slate-100 font-bold text-slate-400 uppercase active:scale-95 transition-all text-xs"
                  >
                    ยกเลิก
                  </button>
                  <button 
                    onClick={() => confirmDeleteMaster(masterItemToDelete)} 
                    className="flex-1 h-14 rounded-2xl bg-red-600 text-white font-black shadow-lg uppercase active:scale-95 transition-all text-xs"
                  >
                    ลบทันที
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Edit Master product modal */}
          {editMasterItem && (
            <div className="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4 animate-modal relative">
                <button 
                  onClick={() => setEditMasterItem(null)}
                  className="absolute top-4 right-4 bg-slate-100 p-2 rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition-colors"
                >
                  <LucideIcon name="x" size={14} />
                </button>
                
                <h3 className="text-sm font-black text-slate-900 text-center uppercase tracking-wider">แก้ไขสินค้าหลัก</h3>
                
                <div className="space-y-1">
                  <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">ชื่อสินค้าหลัก</label>
                  <input 
                    type="text" 
                    className="w-full h-11 bg-slate-50 border rounded-xl px-4 text-xs font-bold outline-none focus:border-indigo-500"
                    value={editMasterItem.name} 
                    onChange={(e) => setEditMasterItem({...editMasterItem, name: e.target.value})} 
                  />
                </div>

                <div className="space-y-1">
                  <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">รูปภาพสินค้า</label>
                  <div className="relative border-2 border-dashed border-slate-200 rounded-xl p-4 hover:bg-slate-50/50 transition-all flex flex-col items-center justify-center gap-1.5 cursor-pointer">
                    <input 
                      type="file" 
                      accept="image/*" 
                      className="absolute inset-0 opacity-0 z-10 cursor-pointer" 
                      onChange={(e) => handleFileChangeInternal(e, setEditMasterItem)}
                    />
                    <LucideIcon name="camera" className="text-slate-400" size={18} />
                    <span className="text-[10px] font-bold text-slate-500">เปลี่ยนรูปภาพใหม่...</span>
                  </div>
                </div>

                {(editMasterItem.preview || editMasterItem.imgUrl) && (
                  <div className="flex justify-center">
                    <img 
                      src={editMasterItem.preview || editMasterItem.imgUrl} 
                      className="max-h-[100px] object-contain rounded-xl border p-1" 
                      alt="" 
                    />
                  </div>
                )}

                <button
                  onClick={handleUpdateMaster}
                  disabled={isEditingMaster}
                  className="w-full h-12 bg-indigo-600 disabled:bg-slate-200 text-white rounded-2xl font-black text-xs shadow-lg"
                >
                  {isEditingMaster ? 'กำลังบันทึก...' : 'บันทึกการแก้ไขสินค้า'}
                </button>
              </div>
            </div>
          )}

          {/* Zoom Image Preview Popup */}
          {previewImage && (
            <div 
              className="fixed inset-0 z-[9999] bg-black/95 flex flex-col items-center justify-center p-4 cursor-zoom-out animate-modal"
              onClick={() => setPreviewImage(null)}
            >
              <img src={previewImage} className="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl" alt="Preview zoom" />
              <p className="text-slate-400 text-xs font-bold mt-4">แตะที่ใดก็ได้บนหน้าจอเพื่อปิดมุมมอง</p>
            </div>
          )}

          {/* Announcement settings modal */}
          {showAnnouncementModal && (
            <div className="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4 animate-modal">
                <h3 className="text-sm font-black text-slate-900 text-center uppercase tracking-widest">
                  อัปเดตประกาศแอปพลิเคชัน
                </h3>
                
                <textarea 
                  rows="4"
                  placeholder="ใส่ข้อความประกาศที่นี่... (เว้นว่างเพื่อยกเลิก)"
                  className="w-full h-32 p-5 bg-slate-50 rounded-2xl border-2 border-slate-100 outline-none focus:border-indigo-500 font-bold text-slate-700 resize-none shadow-inner transition-all"
                  value={announcementInput}
                  onChange={(e) => setAnnouncementInput(e.target.value)}
                />

                <div className="flex gap-2">
                  <button 
                    onClick={() => setShowAnnouncementModal(false)} 
                    className="flex-1 py-4 rounded-2xl bg-slate-100 text-slate-500 font-black uppercase text-xs active:scale-95 transition-all"
                  >
                    ยกเลิก
                  </button>
                  <button 
                    onClick={handleSaveAnnouncement}
                    className="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-black uppercase text-xs active:scale-95 transition-all shadow-md"
                  >
                    บันทึกประกาศ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Edit Product Classifications modal */}
          {editCategoriesMode && (
            <div className="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4 animate-modal relative">
                <button 
                  onClick={() => setEditCategoriesMode(false)}
                  className="absolute top-4 right-4 bg-slate-100 p-1.5 rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition-colors"
                >
                  <LucideIcon name="x" size={14} />
                </button>
                
                <h3 className="text-sm font-black text-slate-900 text-center uppercase tracking-wider">จัดการหมวดหมู่สินค้า</h3>
                
                {/* Adding inputs field */}
                <div className="flex gap-2">
                  <input 
                    type="text" 
                    className="flex-1 h-11 px-3 rounded-xl bg-slate-50 border text-xs font-bold outline-none focus:border-indigo-500" 
                    placeholder="ชื่อหมวดหมู่ใหม่..."
                    value={newCategoryInput} 
                    onChange={(e) => setNewCategoryInput(e.target.value)}
                  />
                  <button 
                    onClick={handleAddCategory}
                    className="px-4 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow-md hover:bg-indigo-700"
                  >
                    เพิ่ม
                  </button>
                </div>

                {/* List items with modifiers */}
                <div className="space-y-1.5 max-h-60 overflow-y-auto no-scrollbar pt-2">
                  {tempCategories.map((cat, i) => (
                    <div key={i} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100">
                      {editingCatIndex === i ? (
                        <div className="flex-1 flex gap-1">
                          <input 
                            type="text" 
                            autoFocus 
                            className="flex-1 bg-white border border-indigo-300 rounded-lg px-3 py-1 font-bold text-indigo-700 outline-none focus:border-indigo-500" 
                            value={editCatText} 
                            onChange={(e) => setEditCatText(e.target.value)} 
                          />
                          <button onClick={saveEditCategory} className="p-1.5 bg-emerald-500 text-white rounded-lg text-[10px] font-bold">บันทึก</button>
                          <button onClick={() => setEditingCatIndex(null)} className="p-2 bg-slate-300 text-white rounded-lg active:scale-90 text-[10px] font-bold">ยกเลิก</button>
                        </div>
                      ) : (
                        <>
                          <span className="text-xs font-black text-slate-700">{cat}</span>
                          <div className="flex gap-1">
                            <button 
                              onClick={() => startEditCategory(i, cat)} 
                              className="w-7 h-7 rounded-lg text-slate-400 hover:text-indigo-600 active:scale-90 transition-colors bg-white border shadow-sm flex items-center justify-center"
                            >
                              <LucideIcon name="edit-2" size={10} />
                            </button>
                            <button 
                              onClick={() => handleDeleteCategory(cat)} 
                              className="w-7 h-7 rounded-lg text-red-400 hover:text-red-600 active:scale-90 transition-colors bg-white border shadow-sm flex items-center justify-center"
                            >
                              <LucideIcon name="trash" size={10} />
                            </button>
                          </div>
                        </>
                      )}
                    </div>
                  ))}
                </div>

                <button 
                  onClick={handleSaveCategories}
                  className="w-full h-11 bg-indigo-600 text-white rounded-xl text-xs font-black shadow-lg hover:bg-indigo-700"
                >
                  บันทึกการเปลี่ยนแปลงทั้งหมด
                </button>
              </div>
            </div>
          )}

          {/* Sticky footer navigation HUD menu */}
          <div className="fixed bottom-0 left-0 right-0 z-40 p-3">
            {renderMenuTabs()}
          </div>

        </div>
      );
    }

    // App Mount Initializer Execution
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
